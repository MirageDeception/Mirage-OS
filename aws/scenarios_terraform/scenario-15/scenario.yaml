number: 15
name: "SAML Okta SSO Role Lure"
slug: "saml-okta-sso"
version: "1.0.0"
category: "privilege-escalation"
service: "iam"

description: |
  Two SAML-trusted IAM roles (admin + developer) that cannot be assumed without a valid SAML assertion.
  A discovery role allows listing SAML providers.
  Any AssumeRoleWithSAML attempt is detected..

resources:
  - type: iam_role
    tf_variable: "role_audit"
    key: "sso-audit"
    purpose: "SSO audit role"
  - type: iam_role
    tf_variable: "role_admin"
    key: "sso-admin"
    purpose: "SSO admin role"
  - type: iam_role
    tf_variable: "role_developer"
    key: "sso-developer"
    purpose: "SSO developer role"

attack_path:
  - "Attacker discovers sso-audit-readonly-role"
  - "Attacker calls iam:ListSAMLProviders"
  - "Attacker attempts sts:AssumeRoleWithSAML on admin or developer role"
  - "CRITICAL alert fires - SSO role assumption attempt"

detection:
  events:
    - source: "aws.sts"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["AssumeRole","AssumeRoleWithSAML"]
    - source: "aws.iam"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["ListSAMLProviders","GetSAMLProvider"]
  severity: "CRITICAL"

terraform:
  required_variables:
    - "account_id"
    - "role_audit"
    - "role_admin"
    - "role_developer"
  outputs:
    - "role_arn"
    - "admin_role_arn"
    - "developer_role_arn"
    - "saml_provider_arn"
