AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 16 - KMS key lure with customer data encryption key.
  Lure role can describe and list but NOT decrypt.
  Discovery role: kms-audit-readonly-role.

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for trust and resource policies

Resources:

  # ---------------------------------------------------------------
  # KMS Key — prod-customer-data-encryption
  # Customer-managed symmetric key. Key policy allows describe/list
  # from account, references realistic service principals.
  # Decrypt is explicitly denied for the lure role.
  # ---------------------------------------------------------------
  CustomerDataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer PII encryption key for production payment and user data
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action:
              - 'kms:Create*'
              - 'kms:Describe*'
              - 'kms:Enable*'
              - 'kms:List*'
              - 'kms:Put*'
              - 'kms:Update*'
              - 'kms:Revoke*'
              - 'kms:Disable*'
              - 'kms:Get*'
              - 'kms:Delete*'
              - 'kms:TagResource'
              - 'kms:UntagResource'
              - 'kms:ScheduleKeyDeletion'
              - 'kms:CancelKeyDeletion'
            Resource: '*'
          - Sid: DenyAllDecrypt
            Effect: Deny
            Principal: '*'
            Action:
              - 'kms:Decrypt'
              - 'kms:Encrypt'
              - 'kms:GenerateDataKey'
              - 'kms:GenerateDataKeyWithoutPlaintext'
              - 'kms:ReEncryptFrom'
              - 'kms:ReEncryptTo'
            Resource: '*'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: customer-platform
        - Key: DataClassification
          Value: PII
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-3200

  CustomerDataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/prod-customer-data-encryption
      TargetKeyId: !Ref CustomerDataKey

  # ---------------------------------------------------------------
  # IAM Role (Discovery) — kms-audit-readonly-role
  # Assumable by any principal in the account. Grants describe/list
  # access to KMS keys. Decrypt is explicitly denied in key policy.
  # ---------------------------------------------------------------
  KmsAuditReadonlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kms-audit-readonly-role
      Description: Read-only KMS audit access for security compliance reviews
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: customer-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-3200

  KmsAuditReadonlyPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: kms-audit-readonly-policy
      Roles:
        - !Ref KmsAuditReadonlyRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: KMSListGlobal
            Effect: Allow
            Action:
              - 'kms:ListAliases'
              - 'kms:ListKeys'
            Resource: '*'
          - Sid: KMSDescribeKey
            Effect: Allow
            Action:
              - 'kms:DescribeKey'
              - 'kms:ListGrants'
              - 'kms:ListKeyPolicies'
              - 'kms:GetKeyPolicy'
            Resource: !GetAtt CustomerDataKey.Arn
          - Sid: DenyDecryptOperations
            Effect: Deny
            Action:
              - 'kms:Decrypt'
              - 'kms:Encrypt'
              - 'kms:GenerateDataKey'
              - 'kms:GenerateDataKeyWithoutPlaintext'
              - 'kms:ReEncryptFrom'
              - 'kms:ReEncryptTo'
            Resource: '*'

Outputs:
  DiscoveryRoleArn:
    Description: ARN of the discovery role (kms-audit-readonly-role)
    Value: !GetAtt KmsAuditReadonlyRole.Arn
  KmsKeyArn:
    Description: ARN of the customer data encryption KMS key
    Value: !GetAtt CustomerDataKey.Arn
  KmsKeyId:
    Description: Key ID of the customer data encryption KMS key
    Value: !Ref CustomerDataKey
  KmsAliasName:
    Description: Alias of the KMS key
    Value: alias/prod-customer-data-encryption
