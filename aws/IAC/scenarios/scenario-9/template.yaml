AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 11 - DynamoDB Lure: Customer Profiles + Active Sessions.
  Two DynamoDB tables seeded with fake PII and JWT session tokens.
  A single IAM role grants read-only access to both tables.
  Every scan or query generates CloudTrail events for detection.

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for trust and resource policies
  IncludeCustomerProfiles:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Include customer profiles table (fake PII)
  IncludeActiveSessions:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Include active sessions table (fake JWTs)

Conditions:
  CreateProfiles: !Equals [!Ref IncludeCustomerProfiles, 'true']
  CreateSessions: !Equals [!Ref IncludeActiveSessions, 'true']

Resources:

  # ---------------------------------------------------------------
  # IAM Role — customer-data-readonly-role
  # Assumable by any principal in the account. Grants DynamoDB
  # read-only access scoped to the lure tables.
  # ---------------------------------------------------------------
  CustomerDataReadonlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: customer-data-readonly-role
      Description: Read-only access to customer data stores for analytics and monitoring
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: customer-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-4210

  CustomerDataListPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: customer-data-list-policy
      Roles:
        - !Ref CustomerDataReadonlyRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DynamoDBListTables
            Effect: Allow
            Action:
              - 'dynamodb:ListTables'
            Resource: '*'

  CustomerProfilesReadPolicy:
    Type: AWS::IAM::Policy
    Condition: CreateProfiles
    Properties:
      PolicyName: customer-profiles-readonly-policy
      Roles:
        - !Ref CustomerDataReadonlyRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadCustomerProfiles
            Effect: Allow
            Action:
              - 'dynamodb:DescribeTable'
              - 'dynamodb:Scan'
              - 'dynamodb:Query'
              - 'dynamodb:GetItem'
            Resource: !GetAtt CustomerProfilesTable.Arn

  ActiveSessionsReadPolicy:
    Type: AWS::IAM::Policy
    Condition: CreateSessions
    Properties:
      PolicyName: active-sessions-readonly-policy
      Roles:
        - !Ref CustomerDataReadonlyRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadActiveSessions
            Effect: Allow
            Action:
              - 'dynamodb:DescribeTable'
              - 'dynamodb:Scan'
              - 'dynamodb:Query'
              - 'dynamodb:GetItem'
            Resource: !GetAtt ActiveSessionsTable.Arn

  # ---------------------------------------------------------------
  # DynamoDB Table 1 — prod-customer-profiles
  # Fake PII: names, emails, phones, card tokens, lifetime values
  # ---------------------------------------------------------------
  CustomerProfilesTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateProfiles
    Properties:
      TableName: prod-customer-profiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH
        - AttributeName: email
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: customer-platform
        - Key: ManagedBy
          Value: terraform

  # ---------------------------------------------------------------
  # DynamoDB Table 2 — prod-active-sessions
  # Fake JWTs, refresh tokens, session IDs, IPs, user agents
  # ---------------------------------------------------------------
  ActiveSessionsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateSessions
    Properties:
      TableName: prod-active-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
        - AttributeName: user_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: auth-platform
        - Key: ManagedBy
          Value: terraform

Outputs:
  DiscoveryRoleArn:
    Description: ARN of the discovery role
    Value: !GetAtt CustomerDataReadonlyRole.Arn
  CustomerProfilesTableName:
    Condition: CreateProfiles
    Description: Name of the customer profiles table
    Value: !Ref CustomerProfilesTable
  CustomerProfilesTableArn:
    Condition: CreateProfiles
    Description: ARN of the customer profiles table
    Value: !GetAtt CustomerProfilesTable.Arn
  ActiveSessionsTableName:
    Condition: CreateSessions
    Description: Name of the active sessions table
    Value: !Ref ActiveSessionsTable
  ActiveSessionsTableArn:
    Condition: CreateSessions
    Description: ARN of the active sessions table
    Value: !GetAtt ActiveSessionsTable.Arn
