AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MIRAGE+ Monitoring Brain — Hub Account Service Rules.
  Contains scalable, generic EventBridge rules per AWS service that forward to the Lambda.
  (Decoy-specific resource filtering happens in the Spoke accounts)

Resources:

  S3ServiceRule:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-svc-s3
      Description: "Routes S3 decoy API calls to the central brain"
      EventBusName: !ImportValue deception-v2-global-bus-name
      State: ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS
      EventPattern:
        source: [aws.s3]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [GetObject, ListBucket, DeleteBucket, PutObject]
      Targets:
        - Id: V2Lambda
          Arn: !ImportValue deception-v2-lambda-arn
          RoleArn: !ImportValue deception-v2-invoke-lambda-role-arn

  SecretsManagerServiceRule:
    Type: AWS::Events::Rule
    Properties:
