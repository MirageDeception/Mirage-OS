AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 4 - Lure IAM Role with S3 SSH key leading to an EC2
  bastion instance seeded with sensitive files. Instance deploys stopped.
  Attacker must modify security group and start instance to access.

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for trust and bucket policies
  KeyPairName:
    Type: String
    Default: prod-bastion-keypair
    Description: Name of the EC2 key pair (created by deploy script)
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy the bastion instance into
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet within the selected VPC
  AllowedSshCidr:
    Type: String
    Default: 165.225.0.0/24
    Description: CIDR range allowed to SSH into the bastion
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-072cdf002809ade8c
    Description: >
      EC2 AMI ID for the bastion instance. Default is an org-approved AMI.
      Override if deploying in a different region or if the default is unavailable.

Resources:

  # ---------------------------------------------------------------
  # Security Group — SSH restricted to deployer-specified CIDR
  # ---------------------------------------------------------------
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: prod-bastion-sg
      GroupDescription: SSH access for production bastion host
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
          Description: SSH from allowed CIDR
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: prod-bastion-sg
        - Key: Environment
          Value: production
        - Key: Project
          Value: devops-platform
        - Key: ManagedBy
          Value: terraform

  # ---------------------------------------------------------------
  # EC2 Instance — lure bastion, deployed STOPPED
  # ---------------------------------------------------------------
  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.nano
      ImageId: !Ref AmiId
      KeyName: !Ref KeyPairName
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref BastionSecurityGroup
          Description: Primary network interface for bastion host
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # --- Seed .env with database and API credentials ---
          cat > /home/ec2-user/.env << 'ENVEOF'
          DATABASE_URL=postgresql://payments_admin:Kj8#mR2xVn5qW9tL@prod-payments-db.c9aksj2e7rzo.us-west-2.rds.amazonaws.com:5432/payments_prod
          STRIPE_SECRET_KEY=sk_live_51NxGr7eD48IqMzkXEbsjT2ze1qp8dc
          REDIS_URL=redis://:r3d1s_pr0d_t0k3n_8xK2mV@prod-payments-cache.eabc12.0001.usw2.cache.amazonaws.com:6379/0
          JWT_SECRET=jwtS1gn1ng_s3cr3t_pr0d_7fA9bC1dE3
          AWS_DEFAULT_REGION=us-west-2
          ENVEOF
          chown ec2-user:ec2-user /home/ec2-user/.env
          chmod 600 /home/ec2-user/.env

          # --- Seed DB backup credentials ---
          mkdir -p /home/ec2-user/config
          cat > /home/ec2-user/config/db-backup-creds.json << 'DBEOF'
          {
            "backup_host": "prod-payments-db-replica.c9aksj2e7rzo.us-west-2.rds.amazonaws.com",
            "port": 5432,
            "username": "backup_agent",
            "password": "BkUp@g3nt#Pr0d2024xM7nQ",
            "database": "payments_prod",
            "s3_backup_bucket": "prod-db-backups-encrypted",
            "schedule": "daily 02:00 UTC"
          }
          DBEOF
          chown -R ec2-user:ec2-user /home/ec2-user/config
          chmod 600 /home/ec2-user/config/db-backup-creds.json

          # --- Seed internal SSH hosts config ---
          mkdir -p /home/ec2-user/.ssh
          cat > /home/ec2-user/.ssh/internal-hosts.conf << 'SSHEOF'
          # Production internal hosts — managed by Ansible
          Host prod-app-01
              HostName 10.0.1.101
              User deploy
          Host prod-app-02
              HostName 10.0.1.102
              User deploy
          Host prod-db-primary
              HostName 10.0.2.50
              User dbadmin
          Host prod-cache-01
              HostName 10.0.3.10
              User redis
          SSHEOF
          chown ec2-user:ec2-user /home/ec2-user/.ssh/internal-hosts.conf
          chmod 600 /home/ec2-user/.ssh/internal-hosts.conf

          # --- Seed AWS credentials placeholder ---
          mkdir -p /root/.aws
          cat > /root/.aws/credentials << 'AWSEOF'
          [default]
          aws_access_key_id = ASIAPLACHOLDER000001
          aws_secret_access_key = PLACEHOLDER_SECRET_KEY_FILL_LATER
          aws_session_token = PLACEHOLDER_SESSION_TOKEN_FILL_LATER
          region = us-west-2
          AWSEOF
          chmod 600 /root/.aws/credentials
      Tags:
        - Key: Name
          Value: prod-bastion-host
        - Key: Environment
          Value: production
        - Key: Project
          Value: devops-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-5830

  # ---------------------------------------------------------------
  # IAM Role — S3 read + EC2 start/modify + SG modify for the lure
  # ---------------------------------------------------------------
  DevopsS3DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: devops-s3-deploy-role
      Description: Read access to deployment keys bucket and bastion instance management
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: devops-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-5830

  DevopsS3DeployPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: devops-s3-deploy-policy
      Roles:
        - !Ref DevopsS3DeployRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListBuckets
            Effect: Allow
            Action:
              - 's3:ListAllMyBuckets'
            Resource: '*'
          - Sid: ReadDeployKeysBucket
            Effect: Allow
            Action:
              - 's3:ListBucket'
              - 's3:GetObject'
            Resource:
              - !GetAtt DeployKeysBucket.Arn
              - !Sub '${DeployKeysBucket.Arn}/*'
          - Sid: DescribeInstances
            Effect: Allow
            Action:
              - 'ec2:DescribeInstances'
              - 'ec2:DescribeSecurityGroups'
            Resource: '*'
          - Sid: ManageBastionInstance
            Effect: Allow
            Action:
              - 'ec2:StartInstances'
              - 'ec2:ModifyInstanceAttribute'
            Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AccountId}:instance/${BastionInstance}'
          - Sid: ModifyBastionSecurityGroup
            Effect: Allow
            Action:
              - 'ec2:AuthorizeSecurityGroupIngress'
              - 'ec2:RevokeSecurityGroupIngress'
            Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AccountId}:security-group/${BastionSecurityGroup}'

  # ---------------------------------------------------------------
  # S3 Bucket — deploy keys store
  # ---------------------------------------------------------------
  DeployKeysBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'devops-deploy-keys-${AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: devops-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-5830

  DeployKeysBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeployKeysBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootReadAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action:
              - 's3:GetObject'
              - 's3:ListBucket'
            Resource:
              - !GetAtt DeployKeysBucket.Arn
              - !Sub '${DeployKeysBucket.Arn}/*'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DeployKeysBucket.Arn
              - !Sub '${DeployKeysBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:
  RoleArn:
    Description: ARN of the lure devops S3 deploy role
    Value: !GetAtt DevopsS3DeployRole.Arn
  BucketName:
    Description: Name of the lure deploy keys bucket
    Value: !Ref DeployKeysBucket
  InstanceId:
    Description: EC2 instance ID of the lure bastion (deployed stopped)
    Value: !Ref BastionInstance
    Export:
      Name: deception-scenario-4-instance-id
  SecurityGroupId:
    Description: Security group ID for the lure bastion
    Value: !Ref BastionSecurityGroup
    Export:
      Name: deception-scenario-4-sg-id
