number: 14
name: "KMS Customer Data Key Lure"
slug: "kms-customer-key"
version: "1.0.0"
category: "privilege-escalation"
service: "kms"

description: |
  A KMS key lure mimicking a customer data encryption key.
  The lure role can describe and list keys but decryption is explicitly denied by key policy.
  Any access generates detection events..

resources:
  - type: iam_role
    tf_variable: "account_id"
    purpose: "See details.md"
  - type: kms_key_alias
    tf_variable: "account_id"
    purpose: "See details.md"

attack_path:
  - "Attacker discovers kms-audit-readonly-role"
  - "Attacker assumes role"
  - "Attacker calls kms:DescribeKey or attempts kms:Decrypt (denied by policy)"
  - "HIGH alert fires"

detection:
  events:
    - source: "aws.sts"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["AssumeRole"]
    - source: "aws.kms"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["DescribeKey","ListKeys","ListAliases","Decrypt"]
  severity: "HIGH"

terraform:
  required_variables:
    - "account_id"
  outputs:
    - "role_arn"
    - "key_arn"
    - "key_alias"
