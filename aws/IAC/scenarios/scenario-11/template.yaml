AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 13 - SQS Lure: Payment Events Dead Letter Queue.
  A FIFO queue pair (main + DLQ) seeded with fake failed payment event
  messages and an IAM role granting read-only access. Every queue
  interaction generates CloudTrail events for detection.

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for trust and resource policies

Resources:

  # ---------------------------------------------------------------
  # IAM Role — payment-queue-readonly-role
  # Assumable by any principal in the account. Grants SQS read-only
  # access scoped to the lure queues.
  # ---------------------------------------------------------------
  PaymentQueueReadonlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: payment-queue-readonly-role
      Description: Read-only access to payment event queues for operations team
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: payment-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-5320

  PaymentQueueReadonlyPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: payment-queue-readonly-policy
      Roles:
        - !Ref PaymentQueueReadonlyRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SQSListQueues
            Effect: Allow
            Action:
              - 'sqs:ListQueues'
            Resource: '*'
          - Sid: SQSReadQueueAttributes
            Effect: Allow
            Action:
              - 'sqs:GetQueueAttributes'
              - 'sqs:GetQueueUrl'
            Resource:
              - !GetAtt PaymentEventsQueue.Arn
              - !GetAtt PaymentEventsDLQ.Arn
          - Sid: SQSReceiveDLQ
            Effect: Allow
            Action:
              - 'sqs:ReceiveMessage'
            Resource: !GetAtt PaymentEventsDLQ.Arn

  # ---------------------------------------------------------------
  # SQS FIFO DLQ — prod-payment-events-dlq.fifo
  # Dead letter queue seeded with fake failed payment event messages.
  # ---------------------------------------------------------------
  PaymentEventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: prod-payment-events-dlq.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 30
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: payment-platform
        - Key: ManagedBy
          Value: terraform

  # ---------------------------------------------------------------
  # SQS FIFO Queue — prod-payment-events.fifo
  # Main queue with DLQ redrive policy.
  # ---------------------------------------------------------------
  PaymentEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: prod-payment-events.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PaymentEventsDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: payment-platform
        - Key: ManagedBy
          Value: terraform

Outputs:
  DiscoveryRoleArn:
    Description: ARN of the discovery role (payment-queue-readonly-role)
    Value: !GetAtt PaymentQueueReadonlyRole.Arn
  MainQueueArn:
    Description: ARN of the main payment events FIFO queue
    Value: !GetAtt PaymentEventsQueue.Arn
  MainQueueUrl:
    Description: URL of the main payment events FIFO queue
    Value: !Ref PaymentEventsQueue
  DLQArn:
    Description: ARN of the payment events dead letter queue
    Value: !GetAtt PaymentEventsDLQ.Arn
  DLQUrl:
    Description: URL of the payment events dead letter queue
    Value: !Ref PaymentEventsDLQ
