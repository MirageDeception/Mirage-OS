AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 17 - SAML provider lure with fake Okta SSO integration.
  Two SAML-trusted roles (admin + developer) that cannot be assumed without
  a valid SAML assertion. Discovery role: sso-audit-readonly-role.

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for trust and resource policies
  SAMLMetadataDocument:
    Type: String
    Description: SAML metadata XML document (generated by deploy.sh)

Resources:

  # ---------------------------------------------------------------
  # IAM Role (Discovery) — sso-audit-readonly-role
  # Assumable by any principal in the account. Grants read-only
  # access to SAML providers and IAM roles.
  # ---------------------------------------------------------------
  SsoAuditReadonlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sso-audit-readonly-role
      Description: Read-only SSO audit access for identity and access management reviews
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: identity-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-1100

  SsoAuditReadonlyPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: sso-audit-readonly-policy
      Roles:
        - !Ref SsoAuditReadonlyRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SAMLProviderList
            Effect: Allow
            Action:
              - 'iam:ListSAMLProviders'
            Resource: '*'
          - Sid: SAMLProviderRead
            Effect: Allow
            Action:
              - 'iam:GetSAMLProvider'
            Resource: !Ref OktaSAMLProvider
          - Sid: RoleList
            Effect: Allow
            Action:
              - 'iam:ListRoles'
            Resource: '*'
          - Sid: RoleRead
            Effect: Allow
            Action:
              - 'iam:GetRole'
            Resource:
              - !GetAtt OktaAdminRole.Arn
              - !GetAtt OktaDeveloperRole.Arn

  # ---------------------------------------------------------------
  # SAML Provider — ProdOktaSSO
  # Realistic Okta SAML metadata with self-signed certificate.
  # Generated by deploy.sh before stack creation.
  # ---------------------------------------------------------------
  OktaSAMLProvider:
    Type: AWS::IAM::SAMLProvider
    Properties:
      Name: ProdOktaSSO
      SamlMetadataDocument: !Ref SAMLMetadataDocument
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: identity-platform
        - Key: SSOProvider
          Value: Okta
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-1100

  # ---------------------------------------------------------------
  # IAM Role (SAML-trusted) — prod-okta-admin-role
  # Trust: SAML provider ProdOktaSSO with SAML:aud condition.
  # Cannot be assumed without a valid SAML assertion from Okta.
  # ---------------------------------------------------------------
  OktaAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prod-okta-admin-role
      Description: Production administrator access via Okta SSO federation
      MaxSessionDuration: 14400
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OktaSAMLProvider
            Action: 'sts:AssumeRoleWithSAML'
            Condition:
              StringEquals:
                'SAML:aud': 'https://signin.aws.amazon.com/saml'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AdministratorAccess'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: identity-platform
        - Key: SSOProvider
          Value: Okta
        - Key: AccessLevel
          Value: admin
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-1100

  # ---------------------------------------------------------------
  # IAM Role (SAML-trusted) — prod-okta-developer-role
  # Trust: SAML provider ProdOktaSSO with SAML:aud condition.
  # Cannot be assumed without a valid SAML assertion from Okta.
  # ---------------------------------------------------------------
  OktaDeveloperRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prod-okta-developer-role
      Description: Production developer access via Okta SSO federation
      MaxSessionDuration: 14400
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OktaSAMLProvider
            Action: 'sts:AssumeRoleWithSAML'
            Condition:
              StringEquals:
                'SAML:aud': 'https://signin.aws.amazon.com/saml'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/PowerUserAccess'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: identity-platform
        - Key: SSOProvider
          Value: Okta
        - Key: AccessLevel
          Value: developer
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-1100

Outputs:
  DiscoveryRoleArn:
    Description: ARN of the discovery role (sso-audit-readonly-role)
    Value: !GetAtt SsoAuditReadonlyRole.Arn
  SAMLProviderArn:
    Description: ARN of the ProdOktaSSO SAML provider
    Value: !Ref OktaSAMLProvider
  AdminRoleArn:
    Description: ARN of the SAML-trusted admin role
    Value: !GetAtt OktaAdminRole.Arn
  DeveloperRoleArn:
    Description: ARN of the SAML-trusted developer role
    Value: !GetAtt OktaDeveloperRole.Arn
