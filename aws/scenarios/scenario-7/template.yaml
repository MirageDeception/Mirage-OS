AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 7 - Lambda Code Injection. Adds InvokeFunction and
  UpdateFunctionCode permissions to the discovery role, enabling an attacker
  to inject code into the Lambda function and steal the execution role's
  temporary credentials. Can link to Scenario 6 or deploy standalone.

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for trust and resource policies
  LinkToScenario6:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: If true, adds permissions to Scenario 6's existing role and function

Conditions:
  IsStandalone: !Equals [!Ref LinkToScenario6, 'false']
  IsLinked: !Equals [!Ref LinkToScenario6, 'true']

Resources:

  # ---------------------------------------------------------------
  # STANDALONE MODE: Full Lambda + roles (when not linked to Scenario 6)
  # ---------------------------------------------------------------

  StandaloneDiscoveryRole:
    Type: AWS::IAM::Role
    Condition: IsStandalone
    Properties:
      RoleName: lambda-inject-readonly-role
      Description: Lambda operations access with code update capability for data engineering
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: data-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-6140

  StandaloneDiscoveryPolicy:
    Type: AWS::IAM::Policy
    Condition: IsStandalone
    Properties:
      PolicyName: lambda-inject-readonly-policy
      Roles:
        - !Ref StandaloneDiscoveryRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaList
            Effect: Allow
            Action:
              - 'lambda:ListFunctions'
            Resource: '*'
          - Sid: LambdaFullAccess
            Effect: Allow
            Action:
              - 'lambda:GetFunction'
              - 'lambda:GetFunctionConfiguration'
              - 'lambda:ListTags'
              - 'lambda:InvokeFunction'
              - 'lambda:UpdateFunctionCode'
            Resource: !GetAtt StandaloneLambda.Arn

  StandaloneExecRole:
    Type: AWS::IAM::Role
    Condition: IsStandalone
    Properties:
      RoleName: prod-data-inject-exec-role
      Description: Execution role for Lambda code injection scenario
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: data-platform
        - Key: ManagedBy
          Value: terraform

  StandaloneExecPolicy:
    Type: AWS::IAM::Policy
    Condition: IsStandalone
    Properties:
      PolicyName: prod-data-inject-exec-policy
      Roles:
        - !Ref StandaloneExecRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3Read
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:ListBucket'
            Resource:
              - !Sub 'arn:aws:s3:::prod-data-inject-artifacts-${AccountId}'
              - !Sub 'arn:aws:s3:::prod-data-inject-artifacts-${AccountId}/*'
          - Sid: SSMRead
            Effect: Allow
            Action:
              - 'ssm:GetParameter'
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/data-inject/config'
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AccountId}:log-group:/aws/lambda/prod-data-inject-processor:*'

  StandaloneLambda:
    Type: AWS::Lambda::Function
    Condition: IsStandalone
    Properties:
      FunctionName: prod-data-inject-processor
      Description: Production data injection processor - ETL pipeline
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt StandaloneExecRole.Arn
      Environment:
        Variables:
          DB_HOST: prod-analytics-db.c9aksj2e7rzo.us-west-2.rds.amazonaws.com
          DB_PORT: '5432'
          DB_NAME: analytics_production
          DB_USER: analytics_etl_svc
          DB_PASSWORD: 'An@lyt1cs#ETL!2024pR0d'
          STRIPE_API_KEY: sk_live_51QxHr8eF59JrNzkYGctjU3af2rq9ef
          ENCRYPTION_KEY: 'aes256:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d'
      Code:
        ZipFile: |
          import json
          import os
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              bucket = os.environ.get('S3_ARTIFACT_BUCKET', 'none')
              db_host = os.environ.get('DB_HOST')
              logger.info(f"Starting data sync run for {db_host}")
              stages = ['extract', 'transform', 'validate', 'load']
              results = {s: {'status': 'completed', 'records': 0} for s in stages}
              return {'statusCode': 200, 'body': json.dumps({'status': 'completed', 'stages': results})}
      Tags:
        Environment: production
        Project: data-platform
        ManagedBy: terraform

  # ---------------------------------------------------------------
  # LINKED MODE: Add permissions to Scenario 6's existing discovery role
  # ---------------------------------------------------------------

  LinkedInjectPolicy:
    Type: AWS::IAM::Policy
    Condition: IsLinked
    Properties:
      PolicyName: lambda-code-inject-policy
      Roles:
        - !ImportValue deception-scenario-6-discovery-role-name
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaInjectPermissions
            Effect: Allow
            Action:
              - 'lambda:InvokeFunction'
              - 'lambda:UpdateFunctionCode'
            Resource: !ImportValue deception-scenario-6-function-arn

Outputs:
  Mode:
    Description: Deployment mode (standalone or linked to scenario-6)
    Value: !If [IsLinked, 'linked-to-scenario-6', 'standalone']
  DiscoveryRoleArn:
    Condition: IsStandalone
    Description: ARN of the standalone discovery role
    Value: !GetAtt StandaloneDiscoveryRole.Arn
  LambdaFunctionArn:
    Condition: IsStandalone
    Description: ARN of the standalone Lambda function
    Value: !GetAtt StandaloneLambda.Arn
