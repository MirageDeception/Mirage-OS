number: 7
name: "Lambda Code Injection Lure"
slug: "lambda-injection"
version: "1.0.0"
category: "privilege-escalation"
service: "lambda"

description: |
  Extends scenario-6 with InvokeFunction and UpdateFunctionCode permissions on the discovery role, enabling an attacker to inject code and steal the execution role credentials..

resources:
  - type: iam_role
    tf_variable: "account_id"
    purpose: "See details.md"
  - type: lambda_function
    tf_variable: "account_id"
    purpose: "See details.md"

attack_path:
  - "Attacker assumes lure role with InvokeFunction permission"
  - "Attacker calls lambda:UpdateFunctionCode with malicious payload"
  - "Lambda executes attacker code under execution role"
  - "CRITICAL alert fires"

detection:
  events:
    - source: "aws.sts"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["AssumeRole"]
    - source: "aws.lambda"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["InvokeFunction","UpdateFunctionCode","GetFunction"]
  severity: "CRITICAL"

terraform:
  required_variables:
    - "account_id"
  outputs:
    - "role_arn"
    - "function_arn"
