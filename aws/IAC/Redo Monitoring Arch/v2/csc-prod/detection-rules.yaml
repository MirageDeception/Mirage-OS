AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cloud Deception v2 — CSC Prod Detection Rules (913511275171, us-west-2).
  19 scenario rules on deception-v2-global-bus targeting v2 Lambda.

Parameters:
  LambdaArn:
    Type: String
    Default: arn:aws:lambda:us-west-2:913511275171:function:deception-v2-event-processor
    Description: ARN of the v2 event processor Lambda

  InvokeLambdaRoleArn:
    Type: String
    Default: arn:aws:iam::913511275171:role/deception-v2-invoke-lambda-role
    Description: ARN of the v2 invoke Lambda role

Resources:

  V2DetectScenario01:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-01
      Description: "Scenario 1 - S3 Terraform State Lure"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.s3]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, GetObject]
          $or:
            - requestParameters: {roleName: [infra-s3-data-readonly-role]}
            - requestParameters: {bucketName: [{prefix: infra-terraform-state-}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario02:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-02
      Description: "Scenario 2 - Secrets Manager Payment Credentials"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.secretsmanager]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, GetSecretValue]
          $or:
            - requestParameters: {roleName: [payment-secrets-readonly-role]}
            - requestParameters: {secretId: [{prefix: "prod/payment-gateway/"}, {prefix: "prod/internal-api/service-accounts"}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario03:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-03
      Description: "Scenario 3 - SSM Parameter Store Infrastructure Vault"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.ssm]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, GetParameter, GetParametersByPath]
          $or:
            - requestParameters: {roleName: [infra-config-readonly-role]}
            - requestParameters: {name: [{prefix: "/prod/database/"}, {prefix: "/prod/ci-cd/"}, {prefix: "/prod/monitoring/"}, {prefix: "/prod/vpn/"}, {prefix: "/prod/kubernetes/"}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario04:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-04
      Description: "Scenario 4 - S3 SSH Key to EC2 Bastion"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.s3, aws.ec2]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, GetObject, StartInstances, AuthorizeSecurityGroupIngress]
          $or:
            - requestParameters: {roleName: [devops-s3-deploy-role]}
            - requestParameters: {bucketName: [{prefix: devops-deploy-keys-}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario05:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-05
      Description: "Scenario 5 - ECR Container Image with PII"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.ecr]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [BatchGetImage, GetDownloadUrlForLayer]
          requestParameters: {repositoryName: [prod-payment-service]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario06:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-06
      Description: "Scenario 6 - Lambda Data Sync Env Var Secrets"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.lambda, aws.s3, aws.secretsmanager, aws.ssm]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, GetFunctionConfiguration20150331v2, GetObject, GetSecretValue, GetParameter]
          $or:
            - requestParameters: {roleName: [lambda-ops-readonly-role]}
            - requestParameters: {functionName: [prod-data-sync-processor]}
            - requestParameters: {bucketName: [{prefix: prod-data-sync-artifacts-}]}
            - requestParameters: {secretId: [{prefix: "prod/data-sync/"}]}
            - requestParameters: {name: [{prefix: "/prod/data-sync/"}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario07:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-07
      Description: "Scenario 7 - Lambda Role Chaining Compliance"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.lambda, aws.s3, aws.secretsmanager, aws.ssm]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, GetFunctionConfiguration20150331v2, GetObject, GetSecretValue, GetParameter]
          $or:
            - requestParameters: {roleName: [compliance-audit-readonly-role, prod-compliance-data-access-role]}
            - requestParameters: {functionName: [prod-compliance-report-generator]}
            - requestParameters: {bucketName: [{prefix: compliance-audit-reports-}]}
            - requestParameters: {secretId: [{prefix: "prod/compliance/"}]}
            - requestParameters: {name: [{prefix: "/prod/compliance/"}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario08:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-08
      Description: "Scenario 8 - IAM Role Chain Loop"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.ssm]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, GetParameter]
          $or:
            - requestParameters: {roleName: [prod-microservice-auth-role, prod-microservice-data-role, prod-microservice-admin-role]}
            - requestParameters: {name: [{prefix: "/prod/auth/"}, {prefix: "/prod/data/"}, {prefix: "/prod/admin/"}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario09:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-09
      Description: "Scenario 9 - DynamoDB Customer Profiles"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.dynamodb]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, DescribeTable, Scan, Query, GetItem]
          $or:
            - requestParameters: {roleName: [customer-data-readonly-role]}
            - requestParameters: {tableName: [prod-customer-profiles]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario10:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-10
      Description: "Scenario 10 - DynamoDB Active Sessions"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.dynamodb]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, DescribeTable, Scan, Query]
          $or:
            - requestParameters: {roleName: [session-store-readonly-role]}
            - requestParameters: {tableName: [prod-active-sessions]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario11:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-11
      Description: "Scenario 11 - SQS Payment Events DLQ"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.sqs]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, GetQueueAttributes, ReceiveMessage]
          $or:
            - requestParameters: {roleName: [payment-queue-readonly-role]}
            - requestParameters: {queueUrl: [{suffix: "/prod-payment-events.fifo"}, {suffix: "/prod-payment-events-dlq.fifo"}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario12:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-12
      Description: "Scenario 12 - SNS Critical Alerts Topic"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.sns]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, GetTopicAttributes, ListSubscriptionsByTopic, Publish]
          $or:
            - requestParameters: {roleName: [alerts-readonly-role]}
            - requestParameters: {topicArn: [{suffix: ":prod-alerts-critical"}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario13:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-13
      Description: "Scenario 13 - CloudWatch Logs Leaked Credentials"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.logs]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, GetLogEvents, FilterLogEvents]
          $or:
            - requestParameters: {roleName: [log-analysis-readonly-role]}
            - requestParameters: {logGroupName: ["/prod/payment-service/application"]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario14:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-14
      Description: "Scenario 14 - KMS Customer Data Encryption Key"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.kms]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, DescribeKey, Decrypt]
          $or:
            - requestParameters: {roleName: [kms-audit-readonly-role]}
            - requestParameters: {keyId: [{prefix: "alias/prod-customer-data-encryption"}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario15:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-15
      Description: "Scenario 15 - SAML Provider Fake Okta SSO"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.iam]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, AssumeRoleWithSAML, GetSAMLProvider]
          $or:
            - requestParameters: {roleName: [sso-audit-readonly-role, prod-okta-admin-role, prod-okta-developer-role]}
            - requestParameters: {sAMLProviderArn: [{suffix: ":saml-provider/ProdOktaSSO"}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario16:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-16
      Description: "Scenario 16 - Resource Tags Breadcrumb Trail"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole]
          requestParameters: {roleName: [resource-inventory-readonly-role]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario17:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-17
      Description: "Scenario 17 - Lambda + DynamoDB Enriched User PII"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.lambda, aws.dynamodb]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, GetFunctionConfiguration20150331v2, DescribeTable, Scan]
          $or:
            - requestParameters: {roleName: [etl-ops-readonly-role]}
            - requestParameters: {functionName: [prod-user-data-enrichment]}
            - requestParameters: {tableName: [prod-enriched-user-profiles]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario18:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-18
      Description: "Scenario 18 - SSM Parameter Cross-Reference Chain"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.ssm]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, GetParameter, GetParametersByPath]
          $or:
            - requestParameters: {roleName: [infra-params-readonly-role]}
            - requestParameters: {name: [{prefix: "/prod/db/"}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn

  V2DetectScenario19:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-v2-detect-19
      Description: "Scenario 19 - CloudFormation Stack Outputs Secrets"
      EventBusName: deception-v2-global-bus
      State: ENABLED
      EventPattern:
        source: [aws.sts, aws.cloudformation]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [AssumeRole, DescribeStacks]
          $or:
            - requestParameters: {roleName: [cfn-audit-readonly-role]}
            - requestParameters: {stackName: [{prefix: prod-core-infrastructure}]}
      Targets:
        - Id: V2Lambda
          Arn: !Ref LambdaArn
          RoleArn: !Ref InvokeLambdaRoleArn
