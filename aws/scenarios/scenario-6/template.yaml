AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 6 - Lambda Blueprint. A Lambda function with hardcoded
  secrets in environment variables. Discovery role grants read-only access to
  Lambda configuration. Optionally includes S3, Secrets Manager, and SSM
  as downstream pivot targets for the execution role.
  This scenario serves as a base that other scenarios (7, 8) can link to.

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for trust and resource policies
  IncludeS3:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Include S3 bucket with fake pipeline artifacts
  IncludeSecretsManager:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Include Secrets Manager secret ($0.40/mo)
  IncludeSSM:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Include SSM parameter with fake config

Conditions:
  CreateS3: !Equals [!Ref IncludeS3, 'true']
  CreateSM: !Equals [!Ref IncludeSecretsManager, 'true']
  CreateSSM: !Equals [!Ref IncludeSSM, 'true']

Resources:

  # ---------------------------------------------------------------
  # IAM Role (Discovery) — lambda-ops-readonly-role
  # Assumable by any principal in the account. Grants read-only
  # access to Lambda function metadata and configuration.
  # ---------------------------------------------------------------
  LambdaOpsReadonlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lambda-ops-readonly-role
      Description: Read-only Lambda operations access for platform engineering team
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: data-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-6140

  LambdaOpsReadonlyPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: lambda-ops-readonly-policy
      Roles:
        - !Ref LambdaOpsReadonlyRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaList
            Effect: Allow
            Action:
              - 'lambda:ListFunctions'
            Resource: '*'
          - Sid: LambdaReadFunction
            Effect: Allow
            Action:
              - 'lambda:GetFunction'
              - 'lambda:GetFunctionConfiguration'
              - 'lambda:ListTags'
            Resource: !GetAtt DataSyncProcessor.Arn

  # ---------------------------------------------------------------
  # IAM Role (Lambda Execution) — prod-data-sync-exec-role
  # Trust: lambda.amazonaws.com only.
  # Permissions conditionally include S3, SM, SSM based on parameters.
  # ---------------------------------------------------------------
  DataSyncExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prod-data-sync-exec-role
      Description: Execution role for prod-data-sync-processor Lambda function
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: data-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-6140

  DataSyncExecBasePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: prod-data-sync-exec-base-policy
      Roles:
        - !Ref DataSyncExecRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AccountId}:log-group:/aws/lambda/prod-data-sync-processor:*'

  DataSyncExecS3Policy:
    Type: AWS::IAM::Policy
    Condition: CreateS3
    Properties:
      PolicyName: prod-data-sync-exec-s3-policy
      Roles:
        - !Ref DataSyncExecRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3ReadArtifacts
            Effect: Allow
            Action:
              - 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::prod-data-sync-artifacts-${AccountId}/*'
          - Sid: S3ListArtifacts
            Effect: Allow
            Action:
              - 's3:ListBucket'
            Resource: !Sub 'arn:aws:s3:::prod-data-sync-artifacts-${AccountId}'

  DataSyncExecSMPolicy:
    Type: AWS::IAM::Policy
    Condition: CreateSM
    Properties:
      PolicyName: prod-data-sync-exec-sm-policy
      Roles:
        - !Ref DataSyncExecRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SecretsManagerRead
            Effect: Allow
            Action:
              - 'secretsmanager:GetSecretValue'
              - 'secretsmanager:DescribeSecret'
            Resource: !Ref ApiCredentialsSecret

  DataSyncExecSSMPolicy:
    Type: AWS::IAM::Policy
    Condition: CreateSSM
    Properties:
      PolicyName: prod-data-sync-exec-ssm-policy
      Roles:
        - !Ref DataSyncExecRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SSMRead
            Effect: Allow
            Action:
              - 'ssm:GetParameter'
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/data-sync/config'

  # ---------------------------------------------------------------
  # Lambda Function — prod-data-sync-processor
  # Environment variables contain secrets (the lure).
  # ---------------------------------------------------------------
  DataSyncProcessor:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: prod-data-sync-processor
      Description: Production data sync processor - ETL pipeline for analytics data lake
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt DataSyncExecRole.Arn
      Environment:
        Variables:
          DB_HOST: prod-analytics-db.c9aksj2e7rzo.us-west-2.rds.amazonaws.com
          DB_PORT: '5432'
          DB_NAME: analytics_production
          DB_USER: analytics_etl_svc
          DB_PASSWORD: 'An@lyt1cs#ETL!2024pR0d'
          STRIPE_API_KEY: sk_live_51QxHr8eF59JrNzkYGctjU3af2rq9ef
          SLACK_WEBHOOK_URL: 'https://hooks.slack.com/services/T0PROD01/B0PROD02/xYzAbCdEfGhIjKlMnOpQrStU'
          ENCRYPTION_KEY: 'aes256:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d'
          S3_ARTIFACT_BUCKET: !Sub 'prod-data-sync-artifacts-${AccountId}'
      Code:
        ZipFile: |
          import json
          import os
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              """
              Production data sync processor.
              Pulls data from analytics DB, transforms, and loads to data lake.
              Triggered on schedule via EventBridge (cron 0 2 * * ? *).
              """
              bucket = os.environ.get('S3_ARTIFACT_BUCKET')
              db_host = os.environ.get('DB_HOST')

              logger.info(f"Starting data sync run for {db_host}")
              logger.info(f"Artifact bucket: {bucket}")

              stages = ['extract', 'transform', 'validate', 'load']
              results = {}

              for stage in stages:
                  logger.info(f"Executing stage: {stage}")
                  results[stage] = {'status': 'completed', 'records': 0}

              return {
                  'statusCode': 200,
                  'body': json.dumps({
                      'pipeline_id': 'ds-prod-001',
                      'status': 'completed',
                      'stages': results
                  })
              }
      Tags:
        Environment: production
        Project: data-platform
        ManagedBy: terraform
        CostCenter: CC-6140

  # ---------------------------------------------------------------
  # S3 Bucket (conditional) — prod-data-sync-artifacts-<account-id>
  # ---------------------------------------------------------------
  DataSyncArtifactsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateS3
    Properties:
      BucketName: !Sub 'prod-data-sync-artifacts-${AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: data-platform
        - Key: ManagedBy
          Value: terraform

  DataSyncArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateS3
    Properties:
      Bucket: !Ref DataSyncArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountRead
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action:
              - 's3:GetObject'
              - 's3:ListBucket'
            Resource:
              - !Sub 'arn:aws:s3:::prod-data-sync-artifacts-${AccountId}'
              - !Sub 'arn:aws:s3:::prod-data-sync-artifacts-${AccountId}/*'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:::prod-data-sync-artifacts-${AccountId}'
              - !Sub 'arn:aws:s3:::prod-data-sync-artifacts-${AccountId}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # ---------------------------------------------------------------
  # Secrets Manager (conditional) — prod/data-sync/api-credentials
  # ---------------------------------------------------------------
  ApiCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSM
    Properties:
      Name: prod/data-sync/api-credentials
      Description: Third-party API credentials for production data sync integrations
      SecretString: '{"placeholder": "replaced-by-deploy-script"}'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: data-platform
        - Key: ManagedBy
          Value: terraform
        - Key: RotationSchedule
          Value: 90days

  ApiCredentialsResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: CreateSM
    Properties:
      SecretId: !Ref ApiCredentialsSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountRead
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action:
              - 'secretsmanager:GetSecretValue'
              - 'secretsmanager:DescribeSecret'
            Resource: '*'

  # ---------------------------------------------------------------
  # SSM Parameter (conditional) — /prod/data-sync/config
  # ---------------------------------------------------------------
  DataSyncConfigParam:
    Type: AWS::SSM::Parameter
    Condition: CreateSSM
    Properties:
      Name: /prod/data-sync/config
      Description: Production data sync pipeline configuration and service endpoints
      Type: String
      Tier: Standard
      Value: '{"placeholder": "replaced-by-deploy-script"}'
      Tags:
        Environment: production
        Project: data-platform
        ManagedBy: terraform

Outputs:
  DiscoveryRoleArn:
    Description: ARN of the discovery role (lambda-ops-readonly-role)
    Value: !GetAtt LambdaOpsReadonlyRole.Arn
    Export:
      Name: deception-scenario-6-discovery-role-arn
  DiscoveryRoleName:
    Description: Name of the discovery role
    Value: !Ref LambdaOpsReadonlyRole
    Export:
      Name: deception-scenario-6-discovery-role-name
  ExecRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt DataSyncExecRole.Arn
    Export:
      Name: deception-scenario-6-exec-role-arn
  LambdaFunctionArn:
    Description: ARN of the lure Lambda function
    Value: !GetAtt DataSyncProcessor.Arn
    Export:
      Name: deception-scenario-6-function-arn
  LambdaFunctionName:
    Description: Name of the lure Lambda function
    Value: !Ref DataSyncProcessor
    Export:
      Name: deception-scenario-6-function-name
  S3BucketName:
    Condition: CreateS3
    Description: Name of the data sync artifacts bucket
    Value: !Ref DataSyncArtifactsBucket
    Export:
      Name: deception-scenario-6-bucket-name
  SecretArn:
    Condition: CreateSM
    Description: ARN of the API credentials secret
    Value: !Ref ApiCredentialsSecret
    Export:
      Name: deception-scenario-6-secret-arn
  SSMParameterName:
    Condition: CreateSSM
    Description: Name of the data sync config SSM parameter
    Value: /prod/data-sync/config
    Export:
      Name: deception-scenario-6-ssm-param-name
