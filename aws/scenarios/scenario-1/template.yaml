AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 1 - Lure IAM Role with S3 Terraform State Bucket.
  Deploys a realistic-looking IAM role and S3 bucket containing a fake
  Terraform state file with expired placeholder credentials.

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for trust policy and bucket policy

Resources:

  # ---------------------------------------------------------------
  # IAM Role - looks like a privileged data-access role
  # ---------------------------------------------------------------
  S3DataAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: infra-s3-data-readonly-role
      Description: Read-only access to infrastructure S3 data stores
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: core-infrastructure
        - Key: ManagedBy
          Value: terraform

  S3DataAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: infra-s3-data-readonly-policy
      Roles:
        - !Ref S3DataAccessRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListBuckets
            Effect: Allow
            Action:
              - 's3:ListAllMyBuckets'
            Resource: '*'
          - Sid: ReadTerraformState
            Effect: Allow
            Action:
              - 's3:ListBucket'
              - 's3:GetObject'
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub '${TerraformStateBucket.Arn}/*'

  # ---------------------------------------------------------------
  # S3 Bucket - fake terraform state backend
  # ---------------------------------------------------------------
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'infra-terraform-state-${AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: core-infrastructure
        - Key: ManagedBy
          Value: terraform

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootReadAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action:
              - 's3:GetObject'
              - 's3:ListBucket'
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub '${TerraformStateBucket.Arn}/*'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub '${TerraformStateBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:
  RoleArn:
    Description: ARN of the lure S3 data access role
    Value: !GetAtt S3DataAccessRole.Arn
  BucketName:
    Description: Name of the lure Terraform state bucket
    Value: !Ref TerraformStateBucket
  BucketArn:
    Description: ARN of the lure Terraform state bucket
    Value: !GetAtt TerraformStateBucket.Arn
