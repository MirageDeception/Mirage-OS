AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 3 - Lure IAM Role with SSM Parameter Store containing
  fake infrastructure credentials (database, CI/CD, monitoring, VPN, Kubernetes).

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for trust policy

Resources:

  # ---------------------------------------------------------------
  # IAM Role - looks like an infra config reader
  # ---------------------------------------------------------------
  InfraConfigReadonlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: infra-config-readonly-role
      Description: Read-only access to production infrastructure configuration parameters
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: platform-infrastructure
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-3045

  InfraConfigPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: infra-config-readonly-policy
      Roles:
        - !Ref InfraConfigReadonlyRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DescribeAllParameters
            Effect: Allow
            Action:
              - 'ssm:DescribeParameters'
            Resource: '*'
          - Sid: ReadProdParameters
            Effect: Allow
            Action:
              - 'ssm:GetParameter'
              - 'ssm:GetParameters'
            Resource:
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/database/master-credentials'
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/ci-cd/github-deploy-token'
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/monitoring/datadog-api-keys'
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/vpn/admin-credentials'
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/kubernetes/cluster-admin-kubeconfig'
          - Sid: GetByPath
            Effect: Allow
            Action:
              - 'ssm:GetParametersByPath'
            Resource:
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod'
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/*'

  # ---------------------------------------------------------------
  # SSM Parameter 1 - RDS master credentials
  # ---------------------------------------------------------------
  DatabaseMasterCredentials:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /prod/database/master-credentials
      Description: RDS MySQL master credentials for the core platform production database
      Type: String
      Tier: Standard
      Value: '{"placeholder": "replaced-by-deploy-script"}'
      Tags:
        Environment: production
        Project: platform-infrastructure
        ManagedBy: terraform
        CostCenter: CC-3045

  # ---------------------------------------------------------------
  # SSM Parameter 2 - GitHub deploy token
  # ---------------------------------------------------------------
  GithubDeployToken:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /prod/ci-cd/github-deploy-token
      Description: GitHub PAT and deploy key for CI/CD pipeline access to platform-monorepo
      Type: String
      Tier: Standard
      Value: '{"placeholder": "replaced-by-deploy-script"}'
      Tags:
        Environment: production
        Project: platform-infrastructure
        ManagedBy: terraform
        CostCenter: CC-3045

  # ---------------------------------------------------------------
  # SSM Parameter 3 - Datadog API keys
  # ---------------------------------------------------------------
  DatadogApiKeys:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /prod/monitoring/datadog-api-keys
      Description: Datadog API and application keys for production monitoring and APM
      Type: String
      Tier: Standard
      Value: '{"placeholder": "replaced-by-deploy-script"}'
      Tags:
        Environment: production
        Project: platform-infrastructure
        ManagedBy: terraform
        CostCenter: CC-3045

  # ---------------------------------------------------------------
  # SSM Parameter 4 - VPN admin credentials
  # ---------------------------------------------------------------
  VpnAdminCredentials:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /prod/vpn/admin-credentials
      Description: VPN appliance admin console credentials and endpoint for production network
      Type: String
      Tier: Standard
      Value: '{"placeholder": "replaced-by-deploy-script"}'
      Tags:
        Environment: production
        Project: platform-infrastructure
        ManagedBy: terraform
        CostCenter: CC-3045

  # ---------------------------------------------------------------
  # SSM Parameter 5 - EKS cluster-admin kubeconfig
  # ---------------------------------------------------------------
  EksKubeconfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /prod/kubernetes/cluster-admin-kubeconfig
      Description: Cluster-admin kubeconfig for prod-platform-cluster EKS cluster
      Type: String
      Tier: Advanced
      Value: 'placeholder-replaced-by-deploy-script'
      Tags:
        Environment: production
        Project: platform-infrastructure
        ManagedBy: terraform
        CostCenter: CC-3045

Outputs:
  RoleArn:
    Description: ARN of the lure infra config role
    Value: !GetAtt InfraConfigReadonlyRole.Arn
  ParameterNames:
    Description: List of lure SSM parameter names
    Value: !Join
      - ', '
      - - /prod/database/master-credentials
        - /prod/ci-cd/github-deploy-token
        - /prod/monitoring/datadog-api-keys
        - /prod/vpn/admin-credentials
        - /prod/kubernetes/cluster-admin-kubeconfig
