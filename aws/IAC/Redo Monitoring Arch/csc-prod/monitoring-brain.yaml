AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cloud Deception — CSC Prod Monitoring Brain (913511275171, us-west-2).
  Core alerting infrastructure: SNS, Lambda, Event Bus, IAM roles.
  This stack is deployed FIRST. Detection rules are deployed separately.

Resources:

  # ===========================================================================
  # SNS TOPIC — Central alert fan-out
  # ===========================================================================
  DeceptionAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: deception-monitoring-alerts
      Tags:
        - Key: Project
          Value: deception-monitoring
        - Key: ManagedBy
          Value: cloudformation

  # ===========================================================================
  # LAMBDA EXECUTION ROLE
  # ===========================================================================
  DeceptionLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: deception-lambda-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: deception-lambda-sns-publish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowSNSPublish
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref DeceptionAlertsTopic
      Tags:
        - Key: Project
          Value: deception-monitoring
        - Key: ManagedBy
          Value: cloudformation

  # ===========================================================================
  # LAMBDA FUNCTION — Event processor (Python 3.11, inline)
  # ===========================================================================
  DeceptionEventProcessor:
    Type: AWS::Lambda::Function
    DependsOn:
      - DeceptionLambdaExecutionRole
      - DeceptionAlertsTopic
    Properties:
      FunctionName: deception-event-processor
      Runtime: python3.11
      Architectures:
        - x86_64
      Handler: index.lambda_handler
      Role: !GetAtt DeceptionLambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref DeceptionAlertsTopic
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          sns = boto3.client('sns')
          SNS_TOPIC_ARN = os.environ['SNS_TOPIC_ARN']

          RESOURCE_TYPE_MAP = {
              'aws.s3':             'S3',
              'aws.ssm':            'SSM',
              'aws.secretsmanager': 'SecretsManager',
              'aws.ecr':            'ECR',
              'aws.lambda':         'Lambda',
              'aws.iam':            'IAM',
              'aws.sts':            'STS',
              'aws.ec2':            'EC2',
              'aws.dynamodb':       'DynamoDB',
              'aws.sqs':            'SQS',
              'aws.sns':            'SNS',
              'aws.logs':           'CloudWatch Logs',
              'aws.kms':            'KMS',
              'aws.cloudformation': 'CloudFormation'
          }

          WHITELISTED_ARNS = [
              'arn:aws:iam::046574264211:role/WizScanner-Role',
              'arn:aws:iam::046574264211:role/WizAccess-Role'
          ]

          def get_resource_name(source, params):
              if source == 'aws.s3':
                  bucket = params.get('bucketName', 'Unknown')
                  key = params.get('key', '')
                  return f"{bucket}/{key}" if key else bucket
              elif source == 'aws.ssm':
                  return params.get('name', 'Unknown')
              elif source == 'aws.secretsmanager':
                  sid = params.get('secretId', 'Unknown')
                  return sid.split(':')[-1] if sid.startswith('arn:') else sid
              elif source == 'aws.ecr':
                  return params.get('repositoryName', 'Unknown')
              elif source == 'aws.lambda':
                  return params.get('functionName', 'Unknown')
              elif source == 'aws.iam':
                  return params.get('roleName', 'Unknown')
              elif source == 'aws.sts':
                  role_arn = params.get('roleArn', '')
                  return role_arn.split('/')[-1] if role_arn else 'Unknown'
              elif source == 'aws.dynamodb':
                  return params.get('tableName', 'Unknown')
              elif source == 'aws.sqs':
                  url = params.get('queueUrl', '')
                  return url.split('/')[-1] if url else 'Unknown'
              elif source == 'aws.kms':
                  return params.get('keyId', 'Unknown')
              elif source == 'aws.cloudformation':
                  return params.get('stackName', 'Unknown')
              return 'Unknown'

          def lambda_handler(event, context):
              detail = event.get('detail', {})
              source = event.get('source', 'Unknown')
              event_name = detail.get('eventName', 'Unknown')
              request_params = detail.get('requestParameters') or {}

              caller_arn = detail.get('userIdentity', {}).get('arn', '')
              if any(w in caller_arn for w in WHITELISTED_ARNS):
                  print(f"Suppressed (whitelisted): {caller_arn}")
                  return {'statusCode': 200, 'body': 'Whitelisted - suppressed'}

              resource_type = RESOURCE_TYPE_MAP.get(source, 'Unknown')
              resource_name = get_resource_name(source, request_params)

              subject = f"Decoy accessed - {resource_type} - {event_name}"[:100]

              message = detail.copy()
              message['action_status'] = 'FAILED' if detail.get('errorCode') else 'SUCCESS'
              message['error_code'] = detail.get('errorCode', 'None')
              message['error_message'] = detail.get('errorMessage', 'None')

              sns.publish(
                  TopicArn=SNS_TOPIC_ARN,
                  Subject=subject,
                  Message=json.dumps(message, indent=2, default=str)
              )

              print(f"Alert | {source} | {resource_name} | {event_name}")
              return {'statusCode': 200, 'body': f'Alert: {resource_type} - {resource_name}'}
      Tags:
        - Key: Project
          Value: deception-monitoring
        - Key: ManagedBy
          Value: cloudformation

  # ===========================================================================
  # LAMBDA RESOURCE POLICY — Allow EventBridge to invoke
  # ===========================================================================
  DeceptionLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    DependsOn: DeceptionEventProcessor
    Properties:
      FunctionName: !Ref DeceptionEventProcessor
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # ===========================================================================
  # EVENTBRIDGE CUSTOM EVENT BUS
  # ===========================================================================
  DeceptionGlobalEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: deception-global-event-bus

  # ===========================================================================
  # IAM ROLE — EventBridge rules invoke Lambda
  # ===========================================================================
  DeceptionEventBridgeInvokeLambdaRole:
    Type: AWS::IAM::Role
    DependsOn: DeceptionEventProcessor
    Properties:
      RoleName: deception-eventbridge-invoke-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustEventBridge
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: deception-invoke-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeLambda
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DeceptionEventProcessor.Arn
      Tags:
        - Key: Project
          Value: deception-monitoring
        - Key: ManagedBy
          Value: cloudformation

Outputs:

  SNSTopicArn:
    Description: Deception alerts SNS topic ARN
    Value: !Ref DeceptionAlertsTopic
    Export:
      Name: deception-monitoring-sns-topic-arn

  LambdaFunctionArn:
    Description: Deception event processor Lambda ARN
    Value: !GetAtt DeceptionEventProcessor.Arn
    Export:
      Name: deception-monitoring-lambda-arn

  LambdaFunctionName:
    Description: Deception event processor Lambda name
    Value: !Ref DeceptionEventProcessor
    Export:
      Name: deception-monitoring-lambda-name

  GlobalEventBusArn:
    Description: Deception global event bus ARN
    Value: !GetAtt DeceptionGlobalEventBus.Arn
    Export:
      Name: deception-monitoring-global-event-bus-arn

  GlobalEventBusName:
    Description: Deception global event bus name
    Value: !Ref DeceptionGlobalEventBus
    Export:
      Name: deception-monitoring-global-event-bus-name

  InvokeLambdaRoleArn:
    Description: EventBridge invoke Lambda role ARN
    Value: !GetAtt DeceptionEventBridgeInvokeLambdaRole.Arn
    Export:
      Name: deception-monitoring-invoke-lambda-role-arn
