AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 9 - IAM Role Chain Loop: three IAM roles in a circular
  assumption chain (A→B→C→A). Each role has read access to a themed SSM
  parameter containing fake credentials. Every hop generates CloudTrail events.

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for trust and resource policies

Resources:

  # ---------------------------------------------------------------
  # IAM Role A — prod-microservice-auth-role
  # Trust: account root principal
  # Permissions: sts:AssumeRole → Role B, ssm:GetParameter on OIDC config
  # ---------------------------------------------------------------
  MicroserviceAuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prod-microservice-auth-role
      Description: Authentication service role for microservices platform
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: microservices
        - Key: ManagedBy
          Value: terraform
        - Key: Service
          Value: auth

  MicroserviceAuthPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: prod-microservice-auth-policy
      Roles:
        - !Ref MicroserviceAuthRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AssumeDataRole
            Effect: Allow
            Action:
              - 'sts:AssumeRole'
            Resource: !GetAtt MicroserviceDataRole.Arn
          - Sid: ReadOIDCConfig
            Effect: Allow
            Action:
              - 'ssm:GetParameter'
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/auth/oidc-config'

  # ---------------------------------------------------------------
  # IAM Role B — prod-microservice-data-role
  # Trust: account root principal
  # Permissions: sts:AssumeRole → Role C, ssm:GetParameter on lake creds
  # ---------------------------------------------------------------
  MicroserviceDataRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prod-microservice-data-role
      Description: Data layer service role for microservices platform
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: microservices
        - Key: ManagedBy
          Value: terraform
        - Key: Service
          Value: data-layer

  MicroserviceDataPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: prod-microservice-data-policy
      Roles:
        - !Ref MicroserviceDataRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AssumeAdminRole
            Effect: Allow
            Action:
              - 'sts:AssumeRole'
            Resource: !GetAtt MicroserviceAdminRole.Arn
          - Sid: ReadLakeCredentials
            Effect: Allow
            Action:
              - 'ssm:GetParameter'
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/data/lake-credentials'

  # ---------------------------------------------------------------
  # IAM Role C — prod-microservice-admin-role
  # Trust: account root principal
  # Permissions: sts:AssumeRole → Role A, ssm:GetParameter on console creds
  # ---------------------------------------------------------------
  MicroserviceAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prod-microservice-admin-role
      Description: Admin console service role for microservices platform
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: microservices
        - Key: ManagedBy
          Value: terraform
        - Key: Service
          Value: admin

  MicroserviceAdminPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: prod-microservice-admin-policy
      Roles:
        - !Ref MicroserviceAdminRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AssumeAuthRole
            Effect: Allow
            Action:
              - 'sts:AssumeRole'
            Resource: !GetAtt MicroserviceAuthRole.Arn
          - Sid: ReadConsoleCredentials
            Effect: Allow
            Action:
              - 'ssm:GetParameter'
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/admin/console-credentials'

  # ---------------------------------------------------------------
  # SSM Parameter 1 — /prod/auth/oidc-config
  # Fake OIDC provider configuration with client secrets
  # ---------------------------------------------------------------
  OIDCConfigParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /prod/auth/oidc-config
      Description: OIDC provider configuration for production authentication service
      Type: String
      Tier: Standard
      Value: '{"placeholder": "replaced-by-deploy-script"}'
      Tags:
        Environment: production
        Project: microservices
        ManagedBy: terraform
        Service: auth

  # ---------------------------------------------------------------
  # SSM Parameter 2 — /prod/data/lake-credentials
  # Fake data lake access credentials
  # ---------------------------------------------------------------
  LakeCredentialsParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /prod/data/lake-credentials
      Description: Data lake service account credentials for production ETL pipelines
      Type: String
      Tier: Standard
      Value: '{"placeholder": "replaced-by-deploy-script"}'
      Tags:
        Environment: production
        Project: microservices
        ManagedBy: terraform
        Service: data-layer

  # ---------------------------------------------------------------
  # SSM Parameter 3 — /prod/admin/console-credentials
  # Fake admin console credentials
  # ---------------------------------------------------------------
  ConsoleCredentialsParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /prod/admin/console-credentials
      Description: Admin console service account credentials for production management plane
      Type: String
      Tier: Standard
      Value: '{"placeholder": "replaced-by-deploy-script"}'
      Tags:
        Environment: production
        Project: microservices
        ManagedBy: terraform
        Service: admin

Outputs:
  AuthRoleArn:
    Description: ARN of the auth service role (Role A — entry point)
    Value: !GetAtt MicroserviceAuthRole.Arn
  DataRoleArn:
    Description: ARN of the data layer service role (Role B)
    Value: !GetAtt MicroserviceDataRole.Arn
  AdminRoleArn:
    Description: ARN of the admin console service role (Role C)
    Value: !GetAtt MicroserviceAdminRole.Arn
  OIDCConfigParamArn:
    Description: ARN of the OIDC config SSM parameter
    Value: !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/auth/oidc-config'
  LakeCredentialsParamArn:
    Description: ARN of the data lake credentials SSM parameter
    Value: !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/data/lake-credentials'
  ConsoleCredentialsParamArn:
    Description: ARN of the admin console credentials SSM parameter
    Value: !Sub 'arn:aws:ssm:${AWS::Region}:${AccountId}:parameter/prod/admin/console-credentials'
