AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 15 - CloudWatch Logs lure with accidentally logged
  credentials in a payment service log group.
  Discovery role: log-analysis-readonly-role.

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for trust and resource policies

Resources:

  # ---------------------------------------------------------------
  # IAM Role (Discovery) — log-analysis-readonly-role
  # Assumable by any principal in the account. Grants read-only
  # access to CloudWatch Logs for the lure log group.
  # ---------------------------------------------------------------
  LogAnalysisReadonlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: log-analysis-readonly-role
      Description: Read-only CloudWatch Logs access for application debugging and analysis
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: payment-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-5100

  LogAnalysisReadonlyPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: log-analysis-readonly-policy
      Roles:
        - !Ref LogAnalysisReadonlyRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DescribeLogGroups
            Effect: Allow
            Action:
              - 'logs:DescribeLogGroups'
            Resource: '*'
          - Sid: ReadLogGroup
            Effect: Allow
            Action:
              - 'logs:DescribeLogStreams'
              - 'logs:GetLogEvents'
              - 'logs:FilterLogEvents'
            Resource:
              - !Sub 'arn:aws:logs:${AWS::Region}:${AccountId}:log-group:/prod/payment-service/application:*'

  # ---------------------------------------------------------------
  # CloudWatch Log Group — /prod/payment-service/application
  # 30-day retention. Log streams and entries seeded by deploy.sh.
  # ---------------------------------------------------------------
  PaymentServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /prod/payment-service/application
      RetentionInDays: 30
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: payment-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-5100

Outputs:
  DiscoveryRoleArn:
    Description: ARN of the discovery role (log-analysis-readonly-role)
    Value: !GetAtt LogAnalysisReadonlyRole.Arn
  LogGroupArn:
    Description: ARN of the payment service log group
    Value: !GetAtt PaymentServiceLogGroup.Arn
  LogGroupName:
    Description: Name of the payment service log group
    Value: /prod/payment-service/application
