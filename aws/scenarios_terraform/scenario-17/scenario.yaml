number: 17
name: "Lambda and DynamoDB PII Pipeline"
slug: "lambda-dynamo-pii"
version: "1.0.0"
category: "data-exfil"
service: "lambda"

description: |
  A Lambda function with environment variable API keys and a DynamoDB table seeded with enriched user PII records.
  Discovery role: etl-ops-readonly-role..

resources:
  - type: iam_role
    tf_variable: "role_ops"
    key: "etl-ops-role"
    purpose: "ETL ops role"
  - type: iam_role
    tf_variable: "role_exec"
    key: "lambda-exec-role"
    purpose: "Lambda exec role"
  - type: lambda_function
    tf_variable: "lambda_name"
    key: "enrichment-lambda"
    purpose: "User data enrichment"
  - type: dynamodb_table
    tf_variable: "table_name"
    key: "enriched-profiles"
    purpose: "PII data table"

attack_path:
  - "Attacker discovers etl-ops-readonly-role"
  - "Attacker calls lambda:GetFunctionConfiguration for env vars"
  - "Attacker scans DynamoDB PII table"
  - "CRITICAL alert fires - PII + credentials"

detection:
  events:
    - source: "aws.sts"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["AssumeRole"]
    - source: "aws.lambda"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["GetFunction","InvokeFunction"]
    - source: "aws.dynamodb"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["Scan","Query","GetItem"]
  severity: "CRITICAL"

terraform:
  required_variables:
    - "account_id"
    - "role_ops"
    - "role_exec"
    - "lambda_name"
    - "table_name"
  outputs:
    - "role_arn"
    - "function_arn"
    - "table_arn"
