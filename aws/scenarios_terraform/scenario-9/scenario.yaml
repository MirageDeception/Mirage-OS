number: 9
name: "DynamoDB Customer Profiles and Sessions"
slug: "dynamodb-profiles"
version: "1.0.0"
category: "data-exfil"
service: "dynamodb"

description: |
  Two DynamoDB tables seeded with fake PII and JWT session tokens.
  A single IAM role grants read-only access.
  Every scan or query generates CloudTrail events for detection..

resources:
  - type: iam_role
    tf_variable: "account_id"
    purpose: "See details.md"
  - type: dynamodb_table
    tf_variable: "account_id"
    purpose: "See details.md"

attack_path:
  - "Attacker discovers customer-profiles-readonly-role"
  - "Attacker calls AssumeRole"
  - "Attacker scans customer_profiles DynamoDB table"
  - "CRITICAL alert fires - PII access"

detection:
  events:
    - source: "aws.sts"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["AssumeRole"]
    - source: "aws.dynamodb"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["Scan","Query","GetItem","DescribeTable"]
  severity: "CRITICAL"

terraform:
  required_variables:
    - "account_id"
  outputs:
    - "role_arn"
    - "customer_table_arn"
    - "sessions_table_arn"
