AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Monitoring Architecture - Main Brain
  Deploys the core alerting infrastructure including SNS, Lambda,
  Global Event Bus, and all required IAM roles.

# ---------------------------------------------------------------
# RESOURCES
# ---------------------------------------------------------------
Resources:

  # ---------------------------------------------------------------
  # 1. SNS TOPIC
  # Central alerting hub — fans out to email and Torq SOAR
  # Subscriptions are added manually after deployment
  # ---------------------------------------------------------------
  DeceptionAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: deception-monitoring-alerts
      Tags:
        - Key: Project
          Value: deception-monitoring
        - Key: ManagedBy
          Value: cloudformation

  # ---------------------------------------------------------------
  # 2. LAMBDA EXECUTION ROLE
  # IAM role assumed by the Lambda function at runtime
  # Grants permissions to write CloudWatch logs and publish to SNS
  # ---------------------------------------------------------------
  DeceptionLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: deception-lambda-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: deception-lambda-sns-publish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowSNSPublish
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref DeceptionAlertsTopic
      Tags:
        - Key: Project
          Value: deception-monitoring
        - Key: ManagedBy
          Value: cloudformation

  # ---------------------------------------------------------------
  # 3. LAMBDA FUNCTION
  # Core processing engine — receives CloudTrail events from
  # EventBridge, enriches them, and publishes alerts to SNS
  # ---------------------------------------------------------------
  DeceptionEventProcessor:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: deception-event-processor
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: index.lambda_handler
      Role: !GetAtt DeceptionLambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref DeceptionAlertsTopic
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          sns = boto3.client('sns')
          SNS_TOPIC_ARN = os.environ['SNS_TOPIC_ARN']

          # Maps AWS event source to human readable resource type
          # Add new resource types here as detection expands
          RESOURCE_TYPE_MAP = {
              'aws.s3':             'S3',
              'aws.ssm':            'SSM',
              'aws.secretsmanager': 'SecretsManager',
              'aws.ecr':            'ECR',
              'aws.lambda':         'Lambda',
              'aws.iam':            'IAM',
              'aws.sts':            'STS'
          }

          # Known legitimate scanner roles — suppress alerts for these
          WHITELISTED_ARNS = [
              'arn:aws:iam::046574264211:role/WizScanner-Role',
              'arn:aws:iam::046574264211:role/WizAccess-Role'
          ]

          def get_resource_name(source, request_params):
              try:
                  if source == 'aws.s3':
                      bucket = request_params.get('bucketName', 'Unknown')
                      key = request_params.get('key', '')
                      return f"{bucket}/{key}" if key else bucket
                  elif source == 'aws.ssm':
                      return request_params.get('name', 'Unknown')
                  elif source == 'aws.secretsmanager':
                      secret_id = request_params.get('secretId', 'Unknown')
                      if secret_id.startswith('arn:'):
                          return secret_id.split(':')[-1]
                      return secret_id
                  elif source == 'aws.ecr':
                      return request_params.get('repositoryName', 'Unknown')
                  elif source == 'aws.lambda':
                      return request_params.get('functionName', 'Unknown')
                  elif source == 'aws.iam':
                      return request_params.get('roleName', 'Unknown')
                  elif source == 'aws.sts':
                      role_arn = request_params.get('roleArn', '')
                      if role_arn:
                          return role_arn.split('/')[-1]
                      return 'Unknown'
              except Exception as e:
                  logger.error(f"Error parsing resource name: {str(e)}")
              return 'Unknown'

          def lambda_handler(event, context):
              try:
                  # STEP 1 - Extract raw event details from EventBridge event
                  detail = event.get('detail', {})
                  source = event.get('source', 'Unknown')
                  event_name = detail.get('eventName', 'Unknown')
                  request_params = detail.get('requestParameters') or {}

                  # STEP 2 - Whitelist check
                  # Suppress alert if event triggered by known legitimate scanner
                  user_identity = detail.get('userIdentity', {})
                  invoked_by = user_identity.get('arn', '')
                  if any(arn in invoked_by for arn in WHITELISTED_ARNS):
                      logger.info(f"Whitelisted ARN detected: {invoked_by} - skipping alert")
                      return {'statusCode': 200, 'body': 'Whitelisted - alert suppressed'}

                  # STEP 3 - Identify resource type and name
                  resource_type = RESOURCE_TYPE_MAP.get(source, 'Unknown Resource')
                  resource_name = get_resource_name(source, request_params)

                  # STEP 4 - Format email subject
                  # SNS subject has 100 character limit - truncate if needed
                  subject = f"Decoy resource accessed - {resource_type} - {event_name}"
                  subject = subject[:100]

                  # STEP 5 - Build message body
                  # Start with raw CloudTrail log and add enrichment fields
                  message = detail.copy()
                  message['action_status'] = "FAILED" if detail.get('errorCode') else "SUCCESS"
                  message['error_code'] = detail.get('errorCode', 'None')
                  message['error_message'] = detail.get('errorMessage', 'None')

                  # STEP 6 - Publish to SNS
                  sns.publish(
                      TopicArn=SNS_TOPIC_ARN,
                      Subject=subject,
                      Message=json.dumps(message, indent=2, default=str)
                  )

                  logger.info(f"Alert fired | Source: {source} | Resource: {resource_name} | Event: {event_name}")
                  return {
                      'statusCode': 200,
                      'body': f'Alert sent for {resource_type} - {resource_name}'
                  }
              except Exception as e:
                  logger.error(f"Critical error processing deception event: {str(e)}")
                  return {'statusCode': 500, 'body': f'Error: {str(e)}'}
    Tags:
      - Key: Project
        Value: deception-monitoring
      - Key: ManagedBy
        Value: cloudformation
    DependsOn:
      - DeceptionLambdaExecutionRole
      - DeceptionAlertsTopic

  # ---------------------------------------------------------------
  # 4. LAMBDA RESOURCE BASED POLICY
  # Allows EventBridge (events.amazonaws.com) to invoke Lambda
  # Scoped to this account only via aws:SourceAccount condition
  # This is separate from the IAM role — it is a resource policy
  # on the Lambda function itself
  # ---------------------------------------------------------------
  DeceptionLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DeceptionEventProcessor
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
    DependsOn: DeceptionEventProcessor

  # ---------------------------------------------------------------
  # 5. EVENTBRIDGE INVOKE LAMBDA ROLE
  # IAM role assumed by detection rules on the global event bus
  # to invoke the Lambda function
  # Trust policy is intentionally broad at account level here
  # Detection rule ARNs are added via separate CFT when rules are created
  # ---------------------------------------------------------------
  DeceptionEventBridgeInvokeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: deception-eventbridge-invoke-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustEventBridgeService
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: deception-invoke-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowLambdaInvoke
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DeceptionEventProcessor.Arn
      Tags:
        - Key: Project
          Value: deception-monitoring
        - Key: ManagedBy
          Value: cloudformation
    DependsOn: DeceptionEventProcessor

  # ---------------------------------------------------------------
  # 6. EVENTBRIDGE FORWARDING ROLE
  # IAM role assumed by the forwarding rule on the default bus
  # to put events into the global event bus
  # Trust policy is intentionally broad at account level here
  # Forwarding rule ARN is added via separate CFT when rule is created
  # ---------------------------------------------------------------
  DeceptionEventBridgeForwardingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: deception-eventbridge-forwarding-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustEventBridgeService
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: deception-forwarding-inline-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowPutEventsToGlobalBus
                Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/deception-global-event-bus
      Tags:
        - Key: Project
          Value: deception-monitoring
        - Key: ManagedBy
          Value: cloudformation

  # ---------------------------------------------------------------
  # 7. GLOBAL EVENT BUS
  # Central event hub that receives forwarded events from the
  # default bus and routes them to detection rules
  # Resource policy allows forwarding role and account root to PutEvents
  # ---------------------------------------------------------------
  DeceptionGlobalEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: deception-global-event-bus
      Tags:
        - Key: Project
          Value: deception-monitoring
        - Key: ManagedBy
          Value: cloudformation
    DependsOn: DeceptionEventBridgeForwardingRole

  DeceptionGlobalEventBusPolicy:
    Type: AWS::Events::EventBusPolicy
    Properties:
      EventBusName: !Ref DeceptionGlobalEventBus
      Statement:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowForwardingRoleToPublish
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: events:PutEvents
            Resource: !GetAtt DeceptionGlobalEventBus.Arn
    DependsOn: DeceptionGlobalEventBus

# ---------------------------------------------------------------
# OUTPUTS
# Exported values for reference and use in subsequent CFTs
# ---------------------------------------------------------------
Outputs:

  SNSTopicArn:
    Description: ARN of the deception alerts SNS topic
    Value: !Ref DeceptionAlertsTopic
    Export:
      Name: deception-monitoring-sns-topic-arn

  LambdaFunctionArn:
    Description: ARN of the deception event processor Lambda function
    Value: !GetAtt DeceptionEventProcessor.Arn
    Export:
      Name: deception-monitoring-lambda-arn

  LambdaFunctionName:
    Description: Name of the deception event processor Lambda function
    Value: !Ref DeceptionEventProcessor
    Export:
      Name: deception-monitoring-lambda-name

  GlobalEventBusArn:
    Description: ARN of the deception global event bus
    Value: !GetAtt DeceptionGlobalEventBus.Arn
    Export:
      Name: deception-monitoring-global-event-bus-arn

  GlobalEventBusName:
    Description: Name of the deception global event bus
    Value: !Ref DeceptionGlobalEventBus
    Export:
      Name: deception-monitoring-global-event-bus-name

  ForwardingRoleArn:
    Description: ARN of the EventBridge forwarding role
    Value: !GetAtt DeceptionEventBridgeForwardingRole.Arn
    Export:
      Name: deception-monitoring-forwarding-role-arn

  InvokeLambdaRoleArn:
    Description: ARN of the EventBridge invoke Lambda role
    Value: !GetAtt DeceptionEventBridgeInvokeLambdaRole.Arn
    Export:
      Name: deception-monitoring-invoke-lambda-role-arn
