number: 16
name: "Resource Tags Breadcrumb Trail"
slug: "tags-breadcrumb"
version: "1.0.0"
category: "lateral-movement"
service: "iam"

description: |
  IAM roles and SSM parameters tagged with ARNs and S3 URIs referencing other resources.
  An attacker who enumerates tags discovers a trail of breadcrumbs generating CloudTrail events at every hop..

resources:
  - type: iam_role
    tf_variable: "role_inventory"
    key: "inventory-role"
    purpose: "Resource inventory role"
  - type: iam_role
    tf_variable: "role_backup"
    key: "backup-role"
    purpose: "Backup automation role"
  - type: ssm_parameter
    tf_variable: "param_registry"
    key: "inventory/service-registry"
    purpose: "Service registry parameter"

attack_path:
  - "Attacker discovers resource-inventory-readonly-role"
  - "Attacker assumes role and enumerates resource tags"
  - "Attacker follows breadcrumb ARNs to additional resources"
  - "Each hop generates CloudTrail events -> MEDIUM alert"

detection:
  events:
    - source: "aws.sts"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["AssumeRole"]
    - source: "aws.ssm"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["GetParameter","GetParameters"]
    - source: "aws.tagging"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["GetResources","ListTagsForResource"]
  severity: "MEDIUM"

terraform:
  required_variables:
    - "account_id"
    - "role_inventory"
    - "role_backup"
    - "param_registry"
  outputs:
    - "role_arn"
    - "parameter_arn"
