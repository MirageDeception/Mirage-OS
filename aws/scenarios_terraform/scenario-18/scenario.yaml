number: 18
name: "SSM Parameter Cross-Reference Chain"
slug: "ssm-param-chain"
version: "1.0.0"
category: "lateral-movement"
service: "ssm"

description: |
  Five SSM parameters under /prod/db/* that cross-reference each other via a see_also field, creating a breadcrumb chain the attacker follows.
  Discovery role: infra-params-readonly-role..

resources:
  - type: iam_role
    tf_variable: "role_name"
    key: "readonly-role"
    purpose: "Readonly role"
  - type: ssm_parameter
    tf_variable: "param_primary"
    key: "db/primary"
    purpose: "Primary DB param"
  - type: ssm_parameter
    tf_variable: "param_replica"
    key: "db/replica"
    purpose: "Replica DB param"
  - type: ssm_parameter
    tf_variable: "param_backup"
    key: "db/backup-config"
    purpose: "Backup config param"
  - type: ssm_parameter
    tf_variable: "param_encryption"
    key: "db/encryption-config"
    purpose: "Encryption config param"
  - type: ssm_parameter
    tf_variable: "param_monitoring"
    key: "db/monitoring"
    purpose: "Monitoring param"

attack_path:
  - "Attacker discovers infra-params-readonly-role"
  - "Attacker calls ssm:GetParametersByPath on /prod/db/"
  - "Attacker follows see_also cross-references"
  - "Each parameter access generates CloudTrail events -> HIGH alert"

detection:
  events:
    - source: "aws.sts"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["AssumeRole"]
    - source: "aws.ssm"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["GetParameter","GetParameters","GetParametersByPath","DescribeParameters"]
  severity: "HIGH"

terraform:
  required_variables:
    - "account_id"
    - "role_name"
    - "param_primary"
    - "param_replica"
    - "param_backup"
    - "param_encryption"
    - "param_monitoring"
  outputs:
    - "role_arn"
