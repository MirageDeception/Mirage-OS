number: 13
name: "CloudWatch Logs Credential Leak"
slug: "cloudwatch-cred-leak"
version: "1.0.0"
category: "credential-theft"
service: "cloudwatchlogs"

description: |
  CloudWatch Logs lure with accidentally-logged credentials in a payment service log group.
  A discovery role with read-only access.
  Any log read triggers detection..

resources:
  - type: iam_role
    tf_variable: "account_id"
    purpose: "See details.md"
  - type: cloudwatch_log_group
    tf_variable: "account_id"
    purpose: "See details.md"

attack_path:
  - "Attacker discovers log-analysis-readonly-role"
  - "Attacker assumes role"
  - "Attacker calls logs:FilterLogEvents on payment service log group"
  - "CRITICAL alert fires - credentials in logs"

detection:
  events:
    - source: "aws.sts"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["AssumeRole"]
    - source: "aws.logs"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["FilterLogEvents","GetLogEvents","DescribeLogStreams"]
  severity: "CRITICAL"

terraform:
  required_variables:
    - "account_id"
  outputs:
    - "role_arn"
    - "log_group_name"
