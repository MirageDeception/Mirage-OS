number: 6
name: "Lambda Blueprint (Hardcoded Secrets)"
slug: "lambda-blueprint"
version: "1.0.0"
category: "credential-theft"
service: "lambda"

description: |
  A Lambda function with hardcoded secrets in environment variables.
  A discovery role grants read-only access to Lambda configuration.
  Downstream pivot targets include S3, Secrets Manager, and SSM..

resources:
  - type: iam_role
    tf_variable: "role_ops"
    key: "lambda-ops-role"
    purpose: "Lambda ops role"
  - type: iam_role
    tf_variable: "role_exec"
    key: "data-sync-exec-role"
    purpose: "Lambda exec role"
  - type: lambda_function
    tf_variable: "lambda_name"
    key: "data-sync-processor"
    purpose: "Data sync lambda"
  - type: s3_bucket
    tf_variable: "bucket_name"
    key: "data-sync-artifacts"
    purpose: "S3 bucket for artifacts"
  - type: secrets_manager
    tf_variable: "secret_api"
    key: "data-sync/api-credentials"
    purpose: "API credentials secret"
  - type: ssm_parameter
    tf_variable: "param_config"
    key: "data-sync/config"
    purpose: "Config parameter"

attack_path:
  - "Attacker discovers discovery role ARN"
  - "Attacker calls lambda:GetFunctionConfiguration"
  - "Attacker reads hardcoded environment variable credentials"
  - "CloudTrail events generated -> HIGH alert"

detection:
  events:
    - source: "aws.sts"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["AssumeRole"]
    - source: "aws.lambda"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["GetFunction","ListFunctions","GetFunctionConfiguration"]
  severity: "HIGH"

terraform:
  required_variables:
    - "account_id"
    - "role_ops"
    - "role_exec"
    - "lambda_name"
    - "bucket_name"
    - "secret_api"
    - "param_config"
  outputs:
    - "role_arn"
    - "function_arn"
