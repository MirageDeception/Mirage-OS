AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cloud Deception v2 — Dev Account Forwarding (2-Rule Consolidated).
  Uses deception-v2-* naming. Does NOT touch v1 resources.
  Targets deception-v2-global-bus in CSC Prod.

Parameters:
  CentralEventBusArn:
    Type: String
    Default: arn:aws:events:us-west-2:913511275171:event-bus/deception-v2-global-bus
    Description: ARN of the v2 central event bus in CSC Prod

  DevAccountId:
    Type: String
    Default: '046574264211'
    Description: This dev account ID

Resources:

  V2ForwardingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: deception-v2-forwarding-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustEventBridgeV2Rules
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref DevAccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:events:${AWS::Region}:${DevAccountId}:rule/deception-v2-fwd-*"
      Policies:
        - PolicyName: deception-v2-forward-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PutEventsToV2Bus
                Effect: Allow
                Action: events:PutEvents
                Resource: !Ref CentralEventBusArn
      Tags:
        - Key: Project
          Value: deception-monitoring
        - Key: ManagedBy
          Value: cloudformation
        - Key: Version
          Value: v2

  V2FwdSTSRoles:
    Type: AWS::Events::Rule
    DependsOn: V2ForwardingRole
    Properties:
      Name: deception-v2-fwd-sts-roles
      Description: "v2 - Forwards AssumeRole on all deception lure role ARNs"
      State: ENABLED
      EventPattern:
        source:
          - aws.sts
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - AssumeRole
            - AssumeRoleWithSAML
          requestParameters:
            roleArn:
              - !Sub "arn:aws:iam::${DevAccountId}:role/infra-s3-data-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/payment-secrets-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/infra-config-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/devops-s3-deploy-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/lambda-ops-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/compliance-audit-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/prod-compliance-data-access-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/prod-microservice-auth-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/prod-microservice-data-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/prod-microservice-admin-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/customer-data-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/session-store-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/payment-queue-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/alerts-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/log-analysis-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/kms-audit-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/sso-audit-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/prod-okta-admin-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/prod-okta-developer-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/resource-inventory-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/etl-ops-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/infra-params-readonly-role"
              - !Sub "arn:aws:iam::${DevAccountId}:role/cfn-audit-readonly-role"
      Targets:
        - Id: V2CentralBus
          Arn: !Ref CentralEventBusArn
          RoleArn: !GetAtt V2ForwardingRole.Arn

  V2FwdResources:
    Type: AWS::Events::Rule
    DependsOn: V2ForwardingRole
    Properties:
      Name: deception-v2-fwd-resources
      Description: "v2 - Forwards events touching any decoy resource"
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
          - aws.secretsmanager
          - aws.ssm
          - aws.ec2
          - aws.ecr
          - aws.lambda
          - aws.dynamodb
          - aws.sqs
          - aws.sns
          - aws.logs
          - aws.kms
          - aws.iam
          - aws.cloudformation
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          requestParameters:
            $or:
              - bucketName:
                  - prefix: infra-terraform-state-
                  - prefix: devops-deploy-keys-
                  - prefix: prod-data-sync-artifacts-
                  - prefix: compliance-audit-reports-
              - secretId:
                  - prefix: "prod/payment-gateway/"
                  - prefix: "prod/internal-api/service-accounts"
                  - prefix: "prod/data-sync/"
                  - prefix: "prod/compliance/"
              - name:
                  - prefix: "/prod/database/"
                  - prefix: "/prod/ci-cd/"
                  - prefix: "/prod/monitoring/"
                  - prefix: "/prod/vpn/"
                  - prefix: "/prod/kubernetes/"
                  - prefix: "/prod/data-sync/"
                  - prefix: "/prod/compliance/"
                  - prefix: "/prod/auth/"
                  - prefix: "/prod/data/"
                  - prefix: "/prod/admin/"
                  - prefix: "/prod/db/"
              - repositoryName:
                  - prod-payment-service
              - functionName:
                  - prod-data-sync-processor
                  - prod-compliance-report-generator
                  - prod-user-data-enrichment
              - tableName:
                  - prod-customer-profiles
                  - prod-active-sessions
                  - prod-enriched-user-profiles
              - queueUrl:
                  - suffix: "/prod-payment-events.fifo"
                  - suffix: "/prod-payment-events-dlq.fifo"
              - topicArn:
                  - suffix: ":prod-alerts-critical"
              - logGroupName:
                  - "/prod/payment-service/application"
              - keyId:
                  - prefix: "alias/prod-customer-data-encryption"
              - sAMLProviderArn:
                  - suffix: ":saml-provider/ProdOktaSSO"
              - stackName:
                  - prefix: prod-core-infrastructure
      Targets:
        - Id: V2CentralBus
          Arn: !Ref CentralEventBusArn
          RoleArn: !GetAtt V2ForwardingRole.Arn

Outputs:

  ForwardingRoleArn:
    Description: v2 forwarding role ARN
    Value: !GetAtt V2ForwardingRole.Arn
    Export:
      Name: deception-v2-forwarding-role-arn

  STSRuleArn:
    Description: v2 STS forwarding rule ARN
    Value: !GetAtt V2FwdSTSRoles.Arn
    Export:
      Name: deception-v2-fwd-sts-rule-arn

  ResourceRuleArn:
    Description: v2 resource access forwarding rule ARN
    Value: !GetAtt V2FwdResources.Arn
    Export:
      Name: deception-v2-fwd-resources-rule-arn
