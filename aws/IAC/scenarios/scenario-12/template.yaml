AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 14 - SNS lure with critical alerts topic and subscription
  endpoints. Discovery role: alerts-readonly-role.

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for trust and resource policies

Resources:

  # ---------------------------------------------------------------
  # IAM Role (Discovery) — alerts-readonly-role
  # Assumable by any principal in the account. Grants read-only
  # access to SNS topics and subscriptions.
  # ---------------------------------------------------------------
  AlertsReadonlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: alerts-readonly-role
      Description: Read-only access to SNS alerting infrastructure for SRE team
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: sre-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-4200

  AlertsReadonlyPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: alerts-readonly-policy
      Roles:
        - !Ref AlertsReadonlyRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SNSListTopics
            Effect: Allow
            Action:
              - 'sns:ListTopics'
            Resource: '*'
          - Sid: SNSReadTopic
            Effect: Allow
            Action:
              - 'sns:GetTopicAttributes'
              - 'sns:ListSubscriptionsByTopic'
              - 'sns:ListTagsForResource'
            Resource: !Ref CriticalAlertsTopic

  # ---------------------------------------------------------------
  # SNS Topic — prod-alerts-critical
  # Encrypted with SSE. Topic policy allows publish from account
  # root only. Subscriptions stay PendingConfirmation.
  # ---------------------------------------------------------------
  CriticalAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: prod-alerts-critical
      DisplayName: Production Critical Alerts
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: sre-platform
        - Key: Severity
          Value: critical
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-4200

  CriticalAlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref CriticalAlertsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountPublish
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action:
              - 'sns:Publish'
            Resource: !Ref CriticalAlertsTopic
          - Sid: DenyExternalPublish
            Effect: Deny
            Principal: '*'
            Action:
              - 'sns:Publish'
            Resource: !Ref CriticalAlertsTopic
            Condition:
              StringNotEquals:
                'aws:PrincipalAccount': !Ref AccountId

  # ---------------------------------------------------------------
  # SNS Subscription — HTTPS webhook (PendingConfirmation)
  # ---------------------------------------------------------------
  HttpsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CriticalAlertsTopic
      Protocol: https
      Endpoint: 'https://hooks.prod.svc.internal/alerts/critical'

  # ---------------------------------------------------------------
  # SNS Subscription — Email (PendingConfirmation)
  # ---------------------------------------------------------------
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CriticalAlertsTopic
      Protocol: email
      Endpoint: 'oncall-soc@fico.com'

Outputs:
  DiscoveryRoleArn:
    Description: ARN of the discovery role (alerts-readonly-role)
    Value: !GetAtt AlertsReadonlyRole.Arn
  TopicArn:
    Description: ARN of the critical alerts SNS topic
    Value: !Ref CriticalAlertsTopic
