number: 3
name: "DevOps Deploy Keys and Bastion Seed"
slug: "deploy-keys"
version: "1.0.0"
category: "credential-theft"
service: "ssm"

description: |
  Deploys SSM parameters containing fake SSH deploy keys and CI/CD secrets,
  plus an S3 bucket mimicking a deploy keys store. An IAM role grants
  read access. Simulates a CI/CD credential store that attackers target.

resources:
  - type: iam_role
    tf_variable: "account_id"
    purpose: "Lure role for DevOps credential access"
  - type: ssm_parameter
    tf_variable: "account_id"
    purpose: "Fake SSH deploy keys in SSM"
  - type: s3_bucket
    tf_variable: "account_id"
    purpose: "Fake deploy keys store"

attack_path:
  - "Attacker discovers devops-readonly-role ARN"
  - "Attacker calls sts:AssumeRole on the lure role"
  - "Attacker calls ssm:GetParameter or s3:GetObject"
  - "CloudTrail events generated → HIGH alert"

detection:
  events:
    - source: "aws.sts"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["AssumeRole"]
    - source: "aws.ssm"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["GetParameter", "GetParameters", "GetParametersByPath"]
    - source: "aws.s3"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["GetObject", "ListBucket"]
  severity: "HIGH"

terraform:
  required_variables:
    - "account_id"
  outputs:
    - "role_arn"
    - "bucket_arn"
