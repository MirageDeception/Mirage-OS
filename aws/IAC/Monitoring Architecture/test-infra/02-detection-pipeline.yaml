AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CFT 2 - Deception Detection Pipeline.
  EventBridge rule (with read-only management events enabled) that matches
  deception-related CloudTrail events, invokes a Detection Lambda that enriches
  the event with scenario context, and publishes alerts to SNS (email).
  
  Deploy AFTER 01-cloudtrail.yaml is active and logging.

Parameters:
  AlertEmail:
    Type: String
    Default: devanshunagpal@fico.com
    Description: Email address to receive deception alerts

Resources:

  # =================================================================
  # SNS TOPIC — Alert delivery to email
  # =================================================================
  DeceptionAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: deception-alerts
      DisplayName: Deception Alert
      Tags:
        - Key: Purpose
          Value: deception-monitoring
        - Key: ManagedBy
          Value: cloudformation

  DeceptionAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref DeceptionAlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # SNS Topic Policy — allow Lambda to publish
  DeceptionAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref DeceptionAlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLambdaPublish
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sns:Publish'
            Resource: !Ref DeceptionAlertTopic

  # =================================================================
  # DETECTION LAMBDA — Processes CloudTrail events, enriches, alerts
  # =================================================================

  # IAM Role for the Detection Lambda
  DetectionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: deception-detection-lambda-role
      Description: Execution role for the deception detection Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: deception-detection-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudWatch Logs — Lambda needs to write its own logs
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/deception-detection-handler:*'
              # SNS — Lambda publishes alerts
              - Sid: SNSPublish
                Effect: Allow
                Action:
                  - 'sns:Publish'
                Resource: !Ref DeceptionAlertTopic
      Tags:
        - Key: Purpose
          Value: deception-monitoring
        - Key: ManagedBy
          Value: cloudformation

  # The Detection Lambda function
  DetectionLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: deception-detection-handler
      Description: >
        Processes CloudTrail events from EventBridge, maps to deception scenarios,
        classifies severity, and publishes enriched alerts to SNS.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 10
      Role: !GetAtt DetectionLambdaRole.Arn
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref DeceptionAlertTopic
      Code:
        ZipFile: |
          import json
          import os
          import logging
          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          sns = boto3.client('sns')
          SNS_TOPIC_ARN = os.environ['SNS_TOPIC_ARN']

          # ─── Scenario Registry ───────────────────────────────────────────
          # Maps decoy resource names to scenario numbers and descriptions.
          # Only resource-specific events — no list/describe enumeration calls.
          SCENARIO_REGISTRY = {
              1: {
                  "description": "S3 Terraform State Lure",
                  "resources": ["infra-terraform-state-", "infra-s3-data-readonly-role"],
                  "events": ["AssumeRole", "GetObject"],
                  "match": "prefix"
              },
              2: {
                  "description": "Secrets Manager Payment Credentials Lure",
                  "resources": ["prod/payment-gateway/", "prod/internal-api/service-accounts",
                                "payment-secrets-readonly-role"],
                  "events": ["AssumeRole", "GetSecretValue"],
                  "match": "prefix"
              },
              3: {
                  "description": "SSM Parameter Store Infrastructure Vault",
                  "resources": ["/prod/database/", "/prod/ci-cd/", "/prod/monitoring/",
                                "/prod/vpn/", "/prod/kubernetes/", "infra-config-readonly-role"],
                  "events": ["AssumeRole", "GetParameter", "GetParametersByPath"],
                  "match": "prefix"
              },
              4: {
                  "description": "S3 SSH Key to EC2 Bastion Lure",
                  "resources": ["devops-deploy-keys-", "devops-s3-deploy-role"],
                  "events": ["AssumeRole", "GetObject", "AuthorizeSecurityGroupIngress", "StartInstances"],
                  "match": "prefix"
              },
              5: {
                  "description": "ECR Container Image with PII Lure",
                  "resources": ["prod-payment-service", "prod-bastion-ecr-role"],
                  "events": ["BatchGetImage", "GetDownloadUrlForLayer"],
                  "match": "exact"
              },
              6: {
                  "description": "Lambda Data Sync Lure",
                  "resources": ["prod-data-sync-processor", "prod-data-sync-artifacts-",
                                "prod/data-sync/", "lambda-ops-readonly-role"],
                  "events": ["AssumeRole", "GetFunctionConfiguration20150331v2", "GetObject",
                             "GetSecretValue", "GetParameter"],
                  "match": "mixed"
              },
              7: {
                  "description": "Lambda Role Chaining Lure",
                  "resources": ["prod-compliance-report-generator", "compliance-audit-reports-",
                                "prod/compliance/", "compliance-audit-readonly-role",
                                "prod-compliance-data-access-role"],
                  "events": ["AssumeRole", "GetFunctionConfiguration20150331v2",
                             "GetObject", "GetSecretValue", "GetParameter"],
                  "match": "mixed"
              },
              8: {
                  "description": "IAM Role Chain Loop",
                  "resources": ["prod-microservice-auth-role", "prod-microservice-data-role",
                                "prod-microservice-admin-role", "/prod/auth/", "/prod/data/",
                                "/prod/admin/"],
                  "events": ["AssumeRole", "GetParameter"],
                  "match": "mixed"
              },
              9: {
                  "description": "DynamoDB Customer Profiles Lure",
                  "resources": ["prod-customer-profiles", "customer-data-readonly-role"],
                  "events": ["AssumeRole", "DescribeTable", "Scan", "Query", "GetItem"],
                  "match": "exact"
              },
              10: {
                  "description": "DynamoDB Active Sessions Lure",
                  "resources": ["prod-active-sessions", "session-store-readonly-role"],
                  "events": ["AssumeRole", "DescribeTable", "Scan", "Query"],
                  "match": "exact"
              },
              11: {
                  "description": "SQS Payment Events DLQ Lure",
                  "resources": ["prod-payment-events.fifo", "prod-payment-events-dlq.fifo",
                                "payment-queue-readonly-role"],
                  "events": ["AssumeRole", "GetQueueAttributes", "ReceiveMessage"],
                  "match": "exact"
              },
              12: {
                  "description": "SNS Critical Alerts Topic Lure",
                  "resources": ["prod-alerts-critical", "alerts-readonly-role"],
                  "events": ["AssumeRole", "GetTopicAttributes", "ListSubscriptionsByTopic", "Publish"],
                  "match": "exact"
              },
              13: {
                  "description": "CloudWatch Logs Leaked Credentials Lure",
                  "resources": ["/prod/payment-service/application", "log-analysis-readonly-role"],
                  "events": ["AssumeRole", "GetLogEvents", "FilterLogEvents"],
                  "match": "exact"
              },
              14: {
                  "description": "KMS Encryption Key Lure",
                  "resources": ["alias/prod-customer-data-encryption", "kms-audit-readonly-role"],
                  "events": ["AssumeRole", "DescribeKey", "Decrypt"],
                  "match": "exact"
              },
              15: {
                  "description": "SAML Provider Fake Okta SSO Lure",
                  "resources": ["ProdOktaSSO", "sso-audit-readonly-role",
                                "prod-okta-admin-role", "prod-okta-developer-role"],
                  "events": ["AssumeRole", "GetSAMLProvider", "AssumeRoleWithSAML"],
                  "match": "exact"
              },
              16: {
                  "description": "Resource Tags Breadcrumb Trail Lure",
                  "resources": ["resource-inventory-readonly-role"],
                  "events": ["AssumeRole"],
                  "match": "exact"
              },
              17: {
                  "description": "Lambda + DynamoDB Enriched User PII Lure",
                  "resources": ["prod-user-data-enrichment", "prod-enriched-user-profiles",
                                "etl-ops-readonly-role"],
                  "events": ["AssumeRole", "GetFunctionConfiguration20150331v2", "DescribeTable", "Scan"],
                  "match": "exact"
              },
              18: {
                  "description": "SSM Parameter Cross-Reference Chain Lure",
                  "resources": ["/prod/db/", "infra-params-readonly-role"],
                  "events": ["AssumeRole", "GetParameter", "GetParametersByPath"],
                  "match": "prefix"
              },
              19: {
                  "description": "CloudFormation Stack Outputs Lure",
                  "resources": ["prod-core-infrastructure", "cfn-audit-readonly-role"],
                  "events": ["AssumeRole", "DescribeStacks"],
                  "match": "exact"
              }
          }

          # All lure role names (for quick lookup)
          LURE_ROLES = set()
          for s in SCENARIO_REGISTRY.values():
              for r in s["resources"]:
                  if r.endswith("-role"):
                      LURE_ROLES.add(r)

          # Severity classification
          CRITICAL_EVENTS = {
              "GetSecretValue", "GetObject", "Scan", "Query", "GetItem",
              "ReceiveMessage", "GetLogEvents", "BatchGetImage", "Decrypt",
              "GetFunctionConfiguration20150331v2", "DescribeStacks", "DescribeKey",
              "GetSAMLProvider", "GetTopicAttributes", "GetQueueAttributes",
              "ListSubscriptionsByTopic", "FilterLogEvents", "GetDownloadUrlForLayer",
              "StartInstances", "AuthorizeSecurityGroupIngress", "Publish",
              "GetParameter", "GetParametersByPath", "DescribeTable"
          }
          HIGH_EVENTS = {"AssumeRole", "AssumeRoleWithSAML"}


          def extract_resource_name(detail):
              """Extract the target resource name from a CloudTrail event."""
              params = detail.get("requestParameters") or {}
              
              # Check common fields in order of specificity
              for field in ["roleName", "functionName", "tableName", "name",
                            "secretId", "keyId", "logGroupName", "repositoryName",
                            "stackName", "queueUrl"]:
                  if field in params:
                      val = params[field]
                      # queueUrl contains the queue name at the end
                      if field == "queueUrl" and "/" in val:
                          return val.rsplit("/", 1)[-1]
                      return val

              # Check resources array for ARN-based matching
              resources = detail.get("resources") or []
              for r in resources:
                  arn = r.get("ARN", "")
                  if arn:
                      # Extract the resource name from the ARN
                      parts = arn.split(":")
                      if len(parts) >= 6:
                          return parts[-1].split("/", 1)[-1] if "/" in parts[-1] else parts[-1]

              return detail.get("eventName", "unknown")


          def match_scenario(resource_name):
              """Match a resource name against the scenario registry."""
              for num, scenario in SCENARIO_REGISTRY.items():
                  for pattern in scenario["resources"]:
                      match_type = scenario["match"]
                      if match_type == "exact" and resource_name == pattern:
                          return num, scenario
                      elif match_type == "prefix" and resource_name.startswith(pattern):
                          return num, scenario
                      elif match_type == "mixed":
                          if resource_name == pattern or resource_name.startswith(pattern):
                              return num, scenario
              return None, None


          def classify_severity(event_name, scenario):
              """Classify event severity: CRITICAL or HIGH."""
              if event_name in CRITICAL_EVENTS:
                  return "CRITICAL"
              elif event_name in HIGH_EVENTS:
                  return "HIGH"
              else:
                  # Unexpected event for a known resource
                  return "HIGH"


          def handler(event, context):
              """Main Lambda handler — processes EventBridge CloudTrail events."""
              try:
                  detail = event.get("detail")
                  if not detail:
                      logger.error(f"No detail field in event: {json.dumps(event)[:500]}")
                      return {"statusCode": 400, "body": "Missing detail"}

                  # Extract fields from CloudTrail event
                  event_name = detail.get("eventName", "unknown")
                  account_id = detail.get("recipientAccountId",
                                detail.get("userIdentity", {}).get("accountId", "unknown"))
                  event_time = detail.get("eventTime", "unknown")
                  source_ip = detail.get("sourceIPAddress", "unknown")
                  user_identity = detail.get("userIdentity", {})
                  user_arn = user_identity.get("arn", "unknown")
                  region = detail.get("awsRegion", "unknown")

                  # Extract resource name
                  resource_name = extract_resource_name(detail)

                  # Match against scenario registry
                  scenario_num, scenario = match_scenario(resource_name)

                  if not scenario:
                      logger.warning(f"No scenario match for resource: {resource_name} "
                                     f"(event: {event_name}, account: {account_id})")
                      return {"statusCode": 200, "body": "No match"}

                  # Classify severity
                  severity = classify_severity(event_name, scenario)

                  # Check if event is expected for this scenario
                  unexpected = event_name not in scenario["events"]
                  if unexpected:
                      severity = "HIGH"

                  # Build alert message
                  alert = {
                      "severity": severity,
                      "scenario_number": scenario_num,
                      "scenario_description": scenario["description"],
                      "account_id": account_id,
                      "event_name": event_name,
                      "event_time": event_time,
                      "source_ip": source_ip,
                      "user_identity_arn": user_arn,
                      "resource_name": resource_name,
                      "region": region,
                      "unexpected_event": unexpected
                  }

                  # Format email
                  emoji = "🚨" if severity == "CRITICAL" else "⚠️"
                  unexpected_note = "\n⚡ UNEXPECTED EVENT for this scenario!" if unexpected else ""
                  email_body = (
                      f"{emoji} DECEPTION ALERT — {severity}\n"
                      f"{'=' * 50}\n\n"
                      f"Scenario:    #{scenario_num} — {scenario['description']}\n"
                      f"Account:     {account_id}\n"
                      f"Event:       {event_name}\n"
                      f"Time (UTC):  {event_time}\n"
                      f"Source IP:   {source_ip}\n"
                      f"User:        {user_arn}\n"
                      f"Resource:    {resource_name}\n"
                      f"Region:      {region}"
                      f"{unexpected_note}\n"
                  )

                  # Publish to SNS
                  sns.publish(
                      TopicArn=SNS_TOPIC_ARN,
                      Subject=f"{emoji} [{severity}] Deception Alert — Scenario #{scenario_num}",
                      Message=email_body,
                      MessageAttributes={
                          'severity': {'DataType': 'String', 'StringValue': severity},
                          'scenario': {'DataType': 'Number', 'StringValue': str(scenario_num)}
                      }
                  )

                  logger.info(f"ALERT SENT: {severity} | Scenario {scenario_num} | "
                              f"{event_name} | {resource_name} | {account_id}")

                  return {"statusCode": 200, "body": json.dumps(alert)}

              except Exception as e:
                  logger.error(f"Error processing event: {str(e)}", exc_info=True)
                  logger.error(f"Raw event: {json.dumps(event)[:1000]}")
                  raise  # Let Lambda retry
      Tags:
        Purpose: deception-monitoring
        ManagedBy: cloudformation

  # Lambda Log Group (explicit creation for retention control)
  DetectionLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/deception-detection-handler
      RetentionInDays: 30

  # =================================================================
  # EVENTBRIDGE RULE — Matches deception CloudTrail events
  #
  # CRITICAL: State is ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS
  # This enables read-only management events (GetSecretValue,
  # GetParameter, DescribeKey, etc.) which are NOT delivered to
  # EventBridge by default.
  #
  # Without this flag, only write events (AssumeRole, StartInstances)
  # would trigger the rule.
  # =================================================================
  DeceptionEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: deception-detection-rule
      Description: >
        Matches CloudTrail events targeting deception/honeypot resources.
        Includes read-only management events (GetSecretValue, GetParameter, etc.)
        and data events (S3 GetObject, DynamoDB Scan, etc.).
      State: ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS
      EventPattern:
        source:
          - aws.iam
          - aws.sts
          - aws.s3
          - aws.secretsmanager
          - aws.ssm
          - aws.lambda
          - aws.dynamodb
          - aws.sqs
          - aws.sns
          - aws.kms
          - aws.logs
          - aws.ecr
          - aws.cloudformation
          - aws.ec2
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - AssumeRole
            - AssumeRoleWithSAML
            - GetObject
            - GetSecretValue
            - GetParameter
            - GetParametersByPath
            - Scan
            - Query
            - GetItem
            - ReceiveMessage
            - BatchGetImage
            - GetDownloadUrlForLayer
            - StartInstances
            - AuthorizeSecurityGroupIngress
            - Decrypt
            - DescribeKey
            - DescribeStacks
            - DescribeTable
            - GetTopicAttributes
            - GetQueueAttributes
            - GetFunctionConfiguration20150331v2
            - GetSAMLProvider
            - GetLogEvents
            - FilterLogEvents
            - ListSubscriptionsByTopic
            - Publish
          $or:
            - requestParameters:
                roleName:
                  - infra-s3-data-readonly-role
                  - payment-secrets-readonly-role
                  - infra-config-readonly-role
                  - devops-s3-deploy-role
                  - prod-bastion-ecr-role
                  - lambda-ops-readonly-role
                  - compliance-audit-readonly-role
                  - prod-compliance-data-access-role
                  - prod-microservice-auth-role
                  - prod-microservice-data-role
                  - prod-microservice-admin-role
                  - customer-data-readonly-role
                  - session-store-readonly-role
                  - payment-queue-readonly-role
                  - alerts-readonly-role
                  - log-analysis-readonly-role
                  - kms-audit-readonly-role
                  - sso-audit-readonly-role
                  - resource-inventory-readonly-role
                  - etl-ops-readonly-role
                  - cfn-audit-readonly-role
                  - infra-params-readonly-role
            - requestParameters:
                functionName:
                  - prod-data-sync-processor
                  - prod-compliance-report-generator
                  - prod-user-data-enrichment
            - requestParameters:
                tableName:
                  - prod-customer-profiles
                  - prod-active-sessions
                  - prod-enriched-user-profiles
            - requestParameters:
                name:
                  - prod-alerts-critical
                  - ProdOktaSSO
            - requestParameters:
                keyId:
                  - prefix: alias/prod-customer-data-encryption
            - requestParameters:
                logGroupName:
                  - /prod/payment-service/application
            - requestParameters:
                repositoryName:
                  - prod-payment-service
            - requestParameters:
                stackName:
                  - prefix: prod-core-infrastructure
            - requestParameters:
                secretId:
                  - prefix: prod/payment-gateway/
                  - prefix: prod/internal-api/
                  - prefix: prod/data-sync/
                  - prefix: prod/compliance/
      Targets:
        - Id: DetectionLambdaTarget
          Arn: !GetAtt DetectionLambdaFunction.Arn

  # Permission for EventBridge to invoke the Lambda
  EventBridgeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DetectionLambdaFunction
      Action: 'lambda:InvokeFunction'
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DeceptionEventRule.Arn

Outputs:
  DetectionLambdaArn:
    Description: ARN of the Detection Lambda
    Value: !GetAtt DetectionLambdaFunction.Arn
  SNSTopicArn:
    Description: ARN of the alert SNS topic
    Value: !Ref DeceptionAlertTopic
  EventRuleName:
    Description: Name of the EventBridge detection rule
    Value: !Ref DeceptionEventRule
  AlertEmail:
    Description: Email receiving alerts (confirm subscription in inbox)
    Value: !Ref AlertEmail
