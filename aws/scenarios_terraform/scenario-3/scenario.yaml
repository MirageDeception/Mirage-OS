number: 3
name: "DevOps Deploy Keys and Bastion Seed"
slug: "deploy-keys"
version: "1.0.0"
category: "credential-theft"
service: "ssm"

description: |
  Deploys SSM parameters containing fake SSH deploy keys and CI/CD secrets,
  plus an S3 bucket mimicking a deploy keys store. An IAM role grants
  read access. Simulates a CI/CD credential store that attackers target.

resources:
  - type: iam_role
    tf_variable: "role_name"
    purpose: "Lure role for DevOps credential access"
  - type: ssm_parameter
    tf_variable: "param_db"
    key: "database/master-credentials"
    purpose: "RDS MySQL master credentials"
  - type: ssm_parameter
    tf_variable: "param_gh"
    key: "ci-cd/github-deploy-token"
    purpose: "GitHub deploy token"
  - type: ssm_parameter
    tf_variable: "param_dd"
    key: "monitoring/datadog-api-keys"
    purpose: "Datadog API keys"
  - type: ssm_parameter
    tf_variable: "param_vpn"
    key: "vpn/admin-credentials"
    purpose: "VPN admin credentials"
  - type: ssm_parameter
    tf_variable: "param_eks"
    key: "kubernetes/cluster-admin-kubeconfig"
    purpose: "EKS cluster admin kubeconfig"

attack_path:
  - "Attacker discovers devops-readonly-role ARN"
  - "Attacker calls sts:AssumeRole on the lure role"
  - "Attacker calls ssm:GetParameter or s3:GetObject"
  - "CloudTrail events generated → HIGH alert"

detection:
  events:
    - source: "aws.sts"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["AssumeRole"]
    - source: "aws.ssm"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["GetParameter", "GetParameters", "GetParametersByPath"]
    - source: "aws.s3"
      detail_type: "AWS API Call via CloudTrail"
      api_calls: ["GetObject", "ListBucket"]
  severity: "HIGH"

terraform:
  required_variables:
    - "account_id"
    - "role_name"
    - "param_db"
    - "param_gh"
    - "param_dd"
    - "param_vpn"
    - "param_eks"
  outputs:
    - "role_arn"
