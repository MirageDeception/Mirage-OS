AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deception Scenario 5 - ECR lure repository with a container image containing
  fake PII, credentials, and ASIA token placeholder. Optionally links to
  scenario-4 bastion via instance profile.

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID for repository policy

Resources:

  # ---------------------------------------------------------------
  # IAM Role — EC2 instance profile with ECR read access
  # ---------------------------------------------------------------
  BastionEcrRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prod-bastion-ecr-role
      Description: ECR read access for production bastion host container operations
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: payment-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-5830

  BastionEcrPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: prod-bastion-ecr-readonly-policy
      Roles:
        - !Ref BastionEcrRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcrAuth
            Effect: Allow
            Action:
              - 'ecr:GetAuthorizationToken'
            Resource: '*'
          - Sid: EcrReadRepo
            Effect: Allow
            Action:
              - 'ecr:BatchGetImage'
              - 'ecr:GetDownloadUrlForLayer'
              - 'ecr:DescribeRepositories'
              - 'ecr:ListImages'
            Resource: !GetAtt PaymentServiceRepo.Arn

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: prod-bastion-ecr-profile
      Roles:
        - !Ref BastionEcrRole

  # ---------------------------------------------------------------
  # ECR Repository — lure container image store
  # ---------------------------------------------------------------
  PaymentServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: prod-payment-service
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountPull
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action:
              - 'ecr:BatchGetImage'
              - 'ecr:GetDownloadUrlForLayer'
              - 'ecr:DescribeRepositories'
              - 'ecr:ListImages'
      Tags:
        - Key: Environment
          Value: production
        - Key: Project
          Value: payment-platform
        - Key: ManagedBy
          Value: terraform
        - Key: CostCenter
          Value: CC-5830

Outputs:
  EcrRepoUri:
    Description: URI of the lure ECR repository
    Value: !Sub '${AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/prod-payment-service'
  EcrRepoArn:
    Description: ARN of the lure ECR repository
    Value: !GetAtt PaymentServiceRepo.Arn
  InstanceProfileArn:
    Description: ARN of the instance profile to attach to scenario-4 bastion
    Value: !GetAtt BastionInstanceProfile.Arn
    Export:
      Name: deception-scenario-5-instance-profile-arn
  InstanceProfileName:
    Description: Name of the instance profile
    Value: !Ref BastionInstanceProfile
    Export:
      Name: deception-scenario-5-instance-profile-name
